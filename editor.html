        async function savePagesJson() {
            const data = storage.currentTask.data;
            if (storage.isServer) {
                const resp = await fetch(`api/save?t=${storage.token}`, { method: 'POST', body: JSON.stringify(data) });
                if (!resp.ok) throw new Error('Failed to save pages.json');
            } else {
                if (!storage.currentTask.pagesJsonHandle) {
                    storage.currentTask.pagesJsonHandle = await storage.currentTask.handle.getFileHandle('pages.json', { create: true });
                }
                const w = await storage.currentTask.pagesJsonHandle.createWritable();
                await w.write(JSON.stringify(data, null, 2));
                await w.close();
            }
        }

        // Delete a page and clean up everything tied to it: its text blocks
        // (in pages.json), translations for those blocks in every language file,
        // and the corresponding clean image. Destructive → double confirmation.
        async function deletePage(index) {
            const pages = storage.currentTask.data.pages;
            if (index < 0 || index >= pages.length) return;
            const page = pages[index];
            const label = `P${index + 1}: ${page.name}`;

            if (!confirm(t('confirmDeletePage', { label }))) return;
            if (!confirm(t('confirmDeletePage2', { label }))) return;

            const idsToRemove = new Set((page.blocks || []).map(b => b.id).filter(Boolean));
            const cleanName = page.clean ? page.clean.split('/').pop() : null;

            try {
                if (storage.isServer) {
                    // Remove the page reference first so pages.json never points at
                    // files the server is about to delete.
                    pages.splice(index, 1);
                    await savePagesJson();
                    // Server-side full cleanup: clean image + every language file.
                    const resp = await fetch(`api/page/delete?t=${storage.token}`, {
                        method: 'POST',
                        body: JSON.stringify({ clean: cleanName, block_ids: [...idsToRemove] })
                    });
                    if (!resp.ok) throw new Error('Server delete failed');
                    // Keep the in-memory current-language translations consistent.
                    idsToRemove.forEach(id => { delete storage.currentTask.translations[id]; });
                    showToast(t('msgPageDeleted'));
                } else {
                    // Clean every language's translation file on disk.
                    try {
                        const transDir = await storage.currentTask.handle.getDirectoryHandle('translations');
                        for await (const entry of transDir.values()) {
                            if (entry.kind !== 'file' || !entry.name.endsWith('.json')) continue;
                            let obj;
                            try {
                                const txt = await (await entry.getFile()).text();
                                obj = txt ? JSON.parse(txt) : {};
                            } catch (e) { continue; }
                            let changed = false;
                            idsToRemove.forEach(id => { if (id in obj) { delete obj[id]; changed = true; } });
                            if (changed) {
                                const w = await entry.createWritable();
                                await w.write(JSON.stringify(obj, null, 2));
                                await w.close();
                            }
                        }
                    } catch (e) { /* no translations dir — nothing to clean */ }

                    // Keep the in-memory current-language translations consistent.
                    idsToRemove.forEach(id => { delete storage.currentTask.translations[id]; });

                    // Delete the clean image file.
                    if (cleanName) {
                        try {
                            const cleanDir = await storage.currentTask.handle.getDirectoryHandle('clean');
                            await cleanDir.removeEntry(cleanName);
                        } catch (e) { console.warn('Failed to remove clean image', cleanName, e); }
                        delete storage.currentTask.imageHandles[cleanName];
                    }

                    pages.splice(index, 1);
                    await savePagesJson();
                    showToast(t('msgPageDeleted'));
                }
            } catch (e) {
                console.error(e);
                showToast(t('msgPageDeleteFailed') + e.message);
                return;
            }

            // Refresh list and fix the current selection.
            renderPageList();
            if (pages.length === 0) {
                state.currentPageIndex = -1;
                state.selectedBlockIndex = -1;
                ctx.clearRect(0, 0, elements.canvas.width, elements.canvas.height);
                elements.canvas.style.display = 'none';
                elements.blocksContainer.innerHTML = '';
                document.getElementById('initial-state').style.display = 'flex';
                elements.totalPages.textContent = '0';
            } else {
                selectPage(Math.min(index, pages.length - 1));
            }
        }

        async function selectPage(index) {
            if (index < 0 || index >= storage.currentTask.data.pages.length) return;
            state.currentPageIndex = index;
            if (storage.collabActive) {
                storage.sendCollabAction();
                redrawActiveCollaborators();
            }
            elements.inputPage.value = index + 1;
            state.selectedBlockIndex = -1;
            state.needsSort = true;
            Array.from(elements.pageList.children).forEach((el, i) => el.classList.toggle('active', i === index));
            // Keep the selected page visible in the list (e.g. when paging with
            // prev/next or jumping from a search result). 'nearest' only scrolls
            // when it's off-screen, so it won't jitter when already visible.
            const activePageItem = elements.pageList.children[index];
            if (activePageItem) activePageItem.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
            elements.btnPrev.disabled = index === 0;
            elements.btnNext.disabled = index === storage.currentTask.data.pages.length - 1;
            
            // Reset scroll position
            elements.canvasContainer.scrollTop = 0;
            elements.canvasContainer.scrollLeft = 0;

            render();
        }

        // Unified re-render of the state-driven views: canvas overlay + editor panel.
        // Use this wherever both need refreshing together; standalone renderPage() /
        // renderBlockEditors() calls remain where only one view should update (e.g. the
        // debounced repaint while typing, which must not rebuild the focused textarea).
        function render() {
            renderPage();
            renderBlockEditors();
        }

        async function renderPage() {
            const page = storage.currentTask.data.pages[state.currentPageIndex];
            const url = await storage.getImageUrl(page);
            if (!url) return;
            elements.canvas.style.display = 'block';
            document.getElementById('initial-state').style.display = 'none';
            const img = new Image();
            img.onload = () => {
                currentImageEl = img;   // cache for lightweight redraw() during region edits
                elements.canvas.width = img.width;
                elements.canvas.height = img.height;
                ctx.clearRect(0, 0, img.width, img.height);
                ctx.drawImage(img, 0, 0);
                if (state.needsSort && page.blocks && page.blocks.length > 1) { sortBlocks(page.blocks, img.width); state.needsSort = false; renderBlockEditors(); }
                renderOverlays(page);
                updateZoomUI();
                if (!storage.isServer) URL.revokeObjectURL(url);
            };
            img.src = url;
        }

        // Lightweight repaint using the cached image (no reload) — used while dragging regions.
        function redraw() {
            if (!currentImageEl) return;
            const page = storage.currentTask.data.pages[state.currentPageIndex];
            if (!page) return;
            ctx.clearRect(0, 0, elements.canvas.width, elements.canvas.height);
            ctx.drawImage(currentImageEl, 0, 0);
            renderOverlays(page);
        }


        // --- High-Fidelity Text Rendering Engine ---
        const CJK_H2V = {
            "‥": "︰", "—": "︱", "—": "|", "–": "︲", "_": "︳", "(": "︵", ")": "︶", "（": "︵", "）": "︶",
            "{": "︷", "}": "︸", "〔": "︹", "〕": "︺", "【": "︻", "】": "︼", "《": "︽", "》": "︾",
            "〈": "︿", "〉": "﹀", "「": "﹁", "」": "﹂", "『": "﹃", "』": "﹄", "﹑": "﹅", "﹆": "﹆",
            "[": "﹇", "]": "﹈", "…": "⋮", "⋯": "︙", "~": "︴", "〜": "︴", "～": "︴", "!": "︕",
            "?": "︖", ".": "︒", "。": "︒", ";": "︔", "；": "︔", ":": "︓", "：": "︓", ",": "︐", "，": "︐", "、": "︑", "-": "︲"
        };

        function compactSymbols(text) {
            return text.replace(/\.\.\./g, '…').replace(/\.\./g, '…');
        }

        function getOptimalFontSize(text, maxWidth, maxHeight, isVertical, minFs = 8, maxFs = 100) {
            let low = minFs, high = maxFs, best = minFs;
            while (low <= high) {
                let mid = Math.floor((low + high) / 2);
                if (checkTextFits(text, maxWidth, maxHeight, mid, isVertical)) {
                    best = mid;
                    low = mid + 1;
                } else {
                    high = mid - 1;
                }
            }
            return best;
        }

        function checkTextFits(text, maxWidth, maxHeight, fontSize, isVertical) {
            if (isVertical) {
                const { cols, height } = layoutVertical(text, maxHeight, fontSize);
                return (cols * fontSize * 1.1) <= maxWidth && height <= maxHeight * 1.1;
            } else {
                const { lines, width } = layoutHorizontal(text, maxWidth, fontSize);
                return (lines.length * fontSize * 1.1) <= maxHeight && width <= maxWidth * 1.1;
            }
        }

        function layoutHorizontal(text, maxWidth, fontSize) {
            ctx.font = `${fontSize}px "Noto Sans SC", "Inter", sans-serif`;
            const segments = text.split('\n');
            const lines = [];
            let maxW = 0;
            for (let segment of segments) {
                if (segment === '') {
                    lines.push('');
                    continue;
                }
                const words = segment.split('');
                let currentLine = '';
                for (let i = 0; i < words.length; i++) {
                    const testLine = currentLine + words[i];
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && currentLine.length > 0) {
                        lines.push(currentLine);
                        currentLine = words[i];
                    } else {
                        currentLine = testLine;
                    }
                }
                lines.push(currentLine);
            }
            for (let line of lines) {
                maxW = Math.max(maxW, ctx.measureText(line).width);
            }
            return { lines, width: maxW };
        }

        function layoutVertical(text, maxHeight, fontSize) {
            const segments = text.split('\n');
            const cols = [];
            let maxH = 0;
            for (let segment of segments) {
                if (segment === '') {
                    cols.push([]);
                    continue;
                }
                let currentCol = [];
                let currentH = 0;
                for (let char of segment) {
                    const displayChar = CJK_H2V[char] || char;
                    const charH = fontSize * 1.1;
                    if (currentH + charH > maxHeight && currentCol.length > 0) {
                        cols.push(currentCol);
                        currentCol = [displayChar];
                        currentH = charH;
                    } else {
                        currentCol.push(displayChar);
                        currentH += charH;
                    }
                    maxH = Math.max(maxH, currentH);
                }
                cols.push(currentCol);
            }
            return { cols, height: maxH };
        }

        function renderOverlays(page) {
            const blocks = page.blocks || [];
            blocks.forEach((block, bIndex) => {
                const rect = effRect(block);
                const x = rect.minX, y = rect.minY, w = rect.maxX - rect.minX, h = rect.maxY - rect.minY;
                const angle = (block.angle || 0) * Math.PI / 180;
                const blockTranslated = !!(storage.currentTask.translations[block.id]?.text || '').trim();

                ctx.save();

                // 1. Handle Rotation and Translation
                const centerX = x + w / 2;
                const centerY = y + h / 2;
                ctx.translate(centerX, centerY);
                ctx.rotate(angle);
                ctx.translate(-centerX, -centerY);

                // 1b. Background-fill preview (matches render's bg_fill pass):
                //   "white" → pure white;  "match" → the block's estimated bg_color.
                if (block.bg_fill === 'white') {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(x, y, w, h);
                } else if (block.bg_fill === 'match') {
                    ctx.fillStyle = rgbCss(block.bg_color || [255, 255, 255]);
                    ctx.fillRect(x, y, w, h);
                }

                // 2. Draw region boundary (solid). Scale line width with the display so
                // it stays clearly visible regardless of image size / zoom.
                const s = _dispScale();
                if (bIndex === state.selectedBlockIndex) {
                    ctx.strokeStyle = document.documentElement.getAttribute('data-theme') === 'light' ? '#e11d48' : '#f43f5e';
                    ctx.lineWidth = Math.max(1.5, 1.5 * s);
                    ctx.strokeRect(x, y, w, h);
                } else {
                    ctx.strokeStyle = 'rgba(99, 102, 241, 0.85)'; ctx.lineWidth = Math.max(1.5, 1.5 * s);
                    ctx.strokeRect(x, y, w, h);
                }

                // 3. Draw block index tag (scaled with display so it stays legible).
                const tagH = 22 * s, tagW = (12 + String(bIndex + 1).length * 9) * s, fz = 14 * s;
                ctx.fillStyle = blockTranslated ? '#6366f1' : '#f59e0b'; ctx.fillRect(x, y - tagH, tagW, tagH);
                ctx.fillStyle = '#fff'; ctx.font = `bold ${fz}px sans-serif`;
                ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
                ctx.fillText(`${bIndex + 1}`, x + 6 * s, y - tagH / 2);
                ctx.textBaseline = 'alphabetic';

                // 4. Draw high-fidelity translated text
                const rawText = storage.currentTask.translations[block.id]?.text;
                if (rawText) {
                    const text = compactSymbols(rawText);
                    const fg = block.fg_color || [0, 0, 0];
                    const bg = block.bg_color || [255, 255, 255];
                    const isVertical = block.direction === 'v';

                    // Use unrotated dimensions for layout to match Python's 'unrotated_size'
                    // For simplicity, we use the bounding box width/height here
                    let fs = block.font_size || 24;
                    let minFs = effMinFs();   // per-task override else config.toml

                    // Match render exactly: box_scale lifts the font ceiling (true
                    // magnification); floor = font_size_minimum (4 for user-fixed boxes).
                    const offset = (globalConfig && globalConfig.render && globalConfig.render.font_size_offset) || 0;
                    const fixedFs = (globalConfig && globalConfig.render && globalConfig.render.font_size) || null;
                    const sc = blockScale(block);
                    const floor = block.fixed_region ? 4 : minFs;
                    let ceiling = fixedFs ? Math.round(fixedFs * 1.2)
                                          : Math.round(((block.font_size || 24) + offset) * sc * 1.2);
                    ceiling = Math.max(ceiling, floor);
                    fs = getOptimalFontSize(text, w, h, isVertical, floor, ceiling);

                    // Check if text fits at the optimal font size
                    const fits = checkTextFits(text, w, h, fs, isVertical);
                    let scaleX = 1.0;
                    let scaleY = 1.0;
                    if (!fits && !block.fixed_region) {
                        if (isVertical) {
                            const { cols, height } = layoutVertical(text, h, fs);
                            const neededW = cols.length * fs * 1.1;
                            const neededH = height;
                            scaleX = w > 0 ? Math.max(neededW / w, 1.0) : 1.0;
                            scaleY = h > 0 ? Math.max(neededH / h, 1.0) : 1.0;
                        } else {
                            const { lines, width } = layoutHorizontal(text, w, fs);
                            const neededH = lines.length * fs * 1.1;
                            const neededW = width;
                            scaleX = w > 0 ? Math.max(neededW / w, 1.0) : 1.0;
                            scaleY = h > 0 ? Math.max(neededH / h, 1.0) : 1.0;
                        }
                        // Cap expansion to avoid very ugly overflow, matching Python
                        let expandLimit = effExpand();   // per-task override else config.toml
                        scaleX = Math.min(scaleX, expandLimit);
                        scaleY = Math.min(scaleY, expandLimit);
                    }

                    const renderW = w * scaleX;
                    const renderH = h * scaleY;
                    const renderX = centerX - renderW / 2;
                    const renderY = centerY - renderH / 2;

                    ctx.font = `${fs}px "Noto Sans SC", "Inter", sans-serif`;
                    ctx.textBaseline = 'top';

                    if (isVertical) {
                        const { cols } = layoutVertical(text, renderH, fs);
                        const totalW = cols.length * fs * 1.1;
                        let startX = renderX + (renderW + totalW) / 2 - fs;
                        cols.forEach(col => {
                            let startY = renderY + (renderH - col.length * fs * 1.1) / 2;
                            col.forEach(char => {
                                drawChar(char, startX, startY, fs, fg, bg);
                                startY += fs * 1.1;
                            });
                            startX -= fs * 1.1;
                        });
                    } else {
                        const { lines } = layoutHorizontal(text, renderW, fs);
                        const totalH = lines.length * fs * 1.1;
                        let startY = renderY + (renderH - totalH) / 2;
                        lines.forEach(line => {
                            const m = ctx.measureText(line);
                            let startX = renderX + (renderW - m.width) / 2;
                            drawTextLine(line, startX, startY, fs, fg, bg);
                            startY += fs * 1.1;
                        });
                    }

                    // Real text extent (what actually gets rendered) — helps you size the box.
                    if (bIndex === state.selectedBlockIndex) {
                        ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2; ctx.setLineDash([5, 3]);
                        ctx.strokeRect(renderX, renderY, renderW, renderH); ctx.setLineDash([]);
                    }
                }

                // Resize handles for the selected block while editing boundaries.
                if (state.editMode && bIndex === state.selectedBlockIndex) {
                    const hh = 6 * _dispScale();
                    const gxs = [x, x + w / 2, x + w], gys = [y, y + h / 2, y + h];
                    ctx.fillStyle = document.documentElement.getAttribute('data-theme') === 'light' ? '#e11d48' : '#f43f5e';
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
                    gxs.forEach(gx => gys.forEach(gy => {
                        if (gx === x + w / 2 && gy === y + h / 2) return; // skip center
                        ctx.fillRect(gx - hh, gy - hh, hh * 2, hh * 2);
                        ctx.strokeRect(gx - hh, gy - hh, hh * 2, hh * 2);
                    }));
                }
                ctx.restore();
            });
        }

        function drawChar(char, x, y, fs, fg, bg) {
            ctx.strokeStyle = `rgb(${bg.join(',')})`;
            ctx.lineWidth = fs * 0.15;
            ctx.lineJoin = 'round';
            ctx.strokeText(char, x, y);
            ctx.fillStyle = `rgb(${fg.join(',')})`;
            ctx.fillText(char, x, y);
        }

        function drawTextLine(line, x, y, fs, fg, bg) {
            ctx.strokeStyle = `rgb(${bg.join(',')})`;
            ctx.lineWidth = fs * 0.15;
            ctx.lineJoin = 'round';
            ctx.strokeText(line, x, y);
            ctx.fillStyle = `rgb(${fg.join(',')})`;
            ctx.fillText(line, x, y);
        }


        function renderBlockEditors() {
            elements.blocksContainer.innerHTML = '';
            const page = storage.currentTask.data.pages[state.currentPageIndex];
            if (!page.blocks?.length) {
                const empty = document.createElement('div');
                empty.className = 'empty-state';
                empty.textContent = 'No text blocks';
                elements.blocksContainer.appendChild(empty);

            }
            page.blocks.forEach((block, bIndex) => {
                const card = document.createElement('div');
                card.className = 'block-card' + (bIndex === state.selectedBlockIndex ? ' selected' : '');
                card.dataset.blockId = block.id;
                card.onclick = (e) => {
                    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'TEXTAREA' && !e.target.closest('button')) {
                        selectBlock(bIndex);
                    }
                };
                const transText = storage.currentTask.translations[block.id]?.text || "";
                const translated = !!transText.trim();
                const bgFill = block.bg_fill || 'none';   // 'none' | 'match' | 'white'
                const bw = block.bbox ? block.bbox[2] : 0, bh = block.bbox ? block.bbox[3] : 0;

                // --- Info row: "Block #N [✎] · {font}px"  +  size / bg / delete ---

                infoRow.className = 'block-info';

                const titleSpan = document.createElement('span');
                if (!translated) {
                    const dot = document.createElement('span');
                    dot.className = 'blk-untrans-dot';
                    dot.title = t('tipUntranslated');
                    titleSpan.appendChild(dot);
                } else if (isLengthSuspect(block.text, transText)) {
                    // Source much shorter than translation → possible partial recognition.
                    const warn = document.createElement('span');
                    warn.className = 'blk-suspect';
                    warn.title = t('tipSuspectLen');
                    warn.appendChild(svgIcon(ICONS.warn, 13));
                    titleSpan.appendChild(warn);
                }
                titleSpan.appendChild(document.createTextNode(`Block #${bIndex + 1}`));
                if (block.user_added) {
                    titleSpan.appendChild(document.createTextNode(' '));
                    titleSpan.appendChild(svgIcon(ICONS.edit, 11));
                }
                titleSpan.appendChild(document.createTextNode(` · ${block.font_size}px`));
                infoRow.appendChild(titleSpan);

                const actions = document.createElement('span');
                actions.className = 'block-actions';

                const sizeSpan = document.createElement('span');
                sizeSpan.className = 'blk-size';
                sizeSpan.textContent = `${bw}×${bh}`;
                actions.appendChild(sizeSpan);

                const bgBtn = document.createElement('button');
                bgBtn.className = 'blk-bg-btn';
                bgBtn.title = bgFill === 'white' ? t('tipBgWhite')
                            : bgFill === 'match' ? t('tipBgMatch') : t('tipBgNone');
                bgBtn.setAttribute('aria-label', bgBtn.title);
                bgBtn.appendChild(svgIcon(bgFill === 'none' ? ICONS.square : ICONS.squareFilled, 15));
                // "match" tints the swatch with the actual fill color so it's distinguishable
                // from "white" at a glance.
                if (bgFill === 'match') bgBtn.style.color = rgbCss(block.bg_color || [255, 255, 255]);
                bgBtn.onclick = (ev) => { ev.stopPropagation(); toggleBlockBg(bIndex); };
                actions.appendChild(bgBtn);

                // Font-color picker: a swatch of the block's current fg_color; opens a
                // palette of black, white + the colors already used in this task.
                const fgBtn = document.createElement('button');
                fgBtn.className = 'blk-fg-btn';
                fgBtn.title = t('tipFontColor');
                fgBtn.setAttribute('aria-label', fgBtn.title);
                const fgDot = document.createElement('span');
                fgDot.className = 'fg-dot';
                fgDot.style.background = rgbCss(block.fg_color);
                fgBtn.appendChild(fgDot);
                fgBtn.onclick = (ev) => { ev.stopPropagation(); openFontColorPicker(bIndex, fgBtn); };
                actions.appendChild(fgBtn);

                // Clone: duplicate this block (same size + colors) offset from the original.
                const cloneBtn = document.createElement('button');
                cloneBtn.className = 'blk-clone-btn';
                cloneBtn.title = t('tipClone');
                cloneBtn.setAttribute('aria-label', cloneBtn.title);
                cloneBtn.appendChild(svgIcon(ICONS.copy, 14));
                cloneBtn.onclick = (ev) => { ev.stopPropagation(); cloneBlockAt(bIndex); };
                actions.appendChild(cloneBtn);

                const delBtn = document.createElement('button');
                delBtn.className = 'blk-del-btn';
                delBtn.title = t('btnDeleteBlock');
                delBtn.setAttribute('aria-label', t('btnDeleteBlock'));
                delBtn.appendChild(svgIcon(ICONS.trash, 15));
                delBtn.onclick = (ev) => { ev.stopPropagation(); deleteBlockAt(bIndex); };
                actions.appendChild(delBtn);

                infoRow.appendChild(actions);
                card.appendChild(infoRow);

                // --- Side-by-side body: original (left) vs translation (right) ---
                const body = document.createElement('div');
                body.className = 'block-body';

                // Original (OCR) column — untrusted → textContent, never innerHTML.
                const origCol = document.createElement('div');
                origCol.className = 'block-col';
                const origLabel = document.createElement('div');
                origLabel.className = 'col-label';
                origLabel.textContent = t('labelOrig');
                const orig = document.createElement('div');
                orig.className = 'orig-text';
                orig.textContent = block.text || '';
                orig.title = t('tipCopyOrig');
                // Double-click the original text to copy it to the clipboard.
                orig.ondblclick = (ev) => {
                    ev.stopPropagation();
                    const txt = block.text || '';
                    if (txt) copyToClipboard(txt);
                };
                origCol.appendChild(origLabel);
                origCol.appendChild(orig);

                // Translation column — value set as property, immune to markup.
                const transCol = document.createElement('div');
                transCol.className = 'block-col';
                const transLabel = document.createElement('div');
                transLabel.className = 'col-label';
                transLabel.textContent = t('labelTrans');
                const textarea = document.createElement('textarea');
                textarea.placeholder = 'Translation...';
                textarea.value = transText;
                if (storage.viewOnly) textarea.readOnly = true;

                const metaRow = document.createElement('div');
                metaRow.className = 'col-meta';

                const updateMetaRow = (val) => {
                    let authorText = '';
                    if (val && (val.text || '').trim()) {
                        if (val.author) {
                            authorText = `@${val.author}`;
                        } else if (val.edited) {
                            authorText = t('authorManual');
                        } else {
                            authorText = t('authorLLM');
                        }
                    }
                    metaRow.textContent = authorText ? `${t('authorLabel')}: ${authorText}` : '';
                };

                textarea.oninput = () => {
                    const prev = storage.currentTask.translations[block.id] || {};
                    // Preserve rev (the base for optimistic-concurrency saves) and any
                    // pending conflict marker across edits.
                    const nextVal = { text: textarea.value, edited: true, rev: prev.rev };
                    if (prev.conflict) nextVal.conflict = prev.conflict;
                    if (storage.currentUser) {
                        nextVal.author = storage.currentUser;
                    }
                    storage.currentTask.translations[block.id] = nextVal;
                    storage.markBlockDirty(block.id);
                    updateMetaRow(nextVal);
                    setDirty(true);
                    updateCurrentPageProgress();
                    clearTimeout(textarea.t); textarea.t = setTimeout(renderPage, 300);
                    storage.sendCursor(block.id, textarea.value);   // live typing preview
                };
                textarea.onfocus = () => {
                    state.selectedBlockIndex = bIndex;
                    redraw();
                    Array.from(elements.blocksContainer.children).forEach((c, i) => c.classList.toggle('selected', i === bIndex));
                    if (storage.collabActive) storage.sendCollabAction(block.id);
                    storage.sendCursor(block.id, textarea.value);   // show my cursor immediately
                };
                textarea.onblur = () => {
                    if (storage.collabActive) storage.sendCollabAction(null);
                    storage.clearCursor();   // remove my live-cursor/typing preview
                };
                transCol.appendChild(transLabel);
                transCol.appendChild(textarea);
                updateMetaRow(storage.currentTask.translations[block.id]);
                transCol.appendChild(metaRow);

                // Render conflict UI if any
                const conflictInfo = storage.currentTask.translations[block.id]?.conflict;
                if (conflictInfo) {
                    const conflictDiv = document.createElement('div');
                    conflictDiv.className = 'conflict-card';
                    conflictDiv.style.border = '1px solid var(--danger)';
                    conflictDiv.style.borderRadius = '4px';
                    conflictDiv.style.padding = '8px';
                    conflictDiv.style.marginTop = '6px';
                    conflictDiv.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
                    
                    const conflictMsg = document.createElement('div');
                    conflictMsg.style.fontSize = '0.7rem';
                    conflictMsg.style.color = '#f87171';
                    conflictMsg.style.marginBottom = '6px';
                    conflictMsg.textContent = `⚠️ Conflict: @${conflictInfo.author || 'another user'} saved "${conflictInfo.text}"`;
                    conflictDiv.appendChild(conflictMsg);
                    
                    const btnKeep = document.createElement('button');
                    btnKeep.className = 'btn-collab-resolve';
                    btnKeep.textContent = t('btnKeepMine') || 'Keep Mine';
                    btnKeep.style.marginRight = '8px';
                    btnKeep.onclick = (ev) => {
                        ev.stopPropagation();
                        // Keep my text but rebase onto the server's current revision so my
                        // next save is accepted instead of re-conflicting. Stays dirty.
                        const v = storage.currentTask.translations[block.id];
                        if (v) { v.rev = conflictInfo.rev; delete v.conflict; }
                        storage.markBlockDirty(block.id);
                        setDirty(true);
                        renderBlockEditors();
                    };
                    conflictDiv.appendChild(btnKeep);

                    const btnReset = document.createElement('button');
                    btnReset.className = 'btn-collab-resolve secondary';
                    btnReset.textContent = t('btnUseServer') || 'Use Server';
                    btnReset.onclick = (ev) => {
                        ev.stopPropagation();
                        // Take the server's value as-is: nothing left to save for this block.
                        storage.currentTask.translations[block.id] = {
                            text: conflictInfo.text,
                            edited: true,
                            author: conflictInfo.author,
                            rev: conflictInfo.rev
                        };
                        storage.dirtyBlocks.delete(block.id);
                        renderBlockEditors();
                        renderPage();
                    };
                    conflictDiv.appendChild(btnReset);
                    
                    transCol.appendChild(conflictDiv);
                }

                body.appendChild(origCol);
                body.appendChild(transCol);
                card.appendChild(body);

                elements.blocksContainer.appendChild(card);
            });
            updateEditingIndicators();
        }

        function sortBlocks(blocks, imgWidth) {
            const thresholdX = Math.max(50, imgWidth * 0.08);
            blocks.sort((a, b) => {
                const rA = getRect(a.polygon), rB = getRect(b.polygon);
                const diffX = rB.maxX - rA.maxX;
                if (Math.abs(diffX) > thresholdX) return diffX;
                return rA.minY - rB.minY;
            });
        }
        function getRect(poly) {
            const xs = poly.map(p => p[0]), ys = poly.map(p => p[1]);
            return { minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
        }

        elements.btnSave.onclick = async () => {
            elements.statusLoader.style.display = 'block';
            try {
                await storage.saveTranslations();
                // Unresolved conflicts (collab2) leave blocks dirty — keep the Save button
                // live so the user can re-save after resolving, instead of looking clean.
                const stillDirty = storage.dirtyBlocks.size > 0 || storage.deletedBlocks.size > 0;
                setDirty(stillDirty);
                if (!stillDirty) showToast(t('saveSuccess'), 'success');
            } catch (e) { if (e.message !== "UNAUTHORIZED") showToast(e.message, 'error'); }
            finally { elements.statusLoader.style.display = 'none'; }
        };

        elements.btnReload.onclick = async () => {
            if (state.isDirty && !confirm(t('confirmSwitch'))) return;
            if (storage.isServer) {
                await storage.loadServerTask();
                await storage.loadServerConfig();
            } else {
                await storage.loadLocalConfig();
                await selectTask(storage.currentTask);
            }
        };

        elements.targetLangSelect.onchange = async () => {
            if (state.isDirty && !confirm(t('confirmSwitch'))) {
                elements.targetLangSelect.value = elements.targetLangSelect.dataset.prev || storage.currentTask.data.target_lang;
                return;
            }
            const newLang = elements.targetLangSelect.value;
            elements.targetLangSelect.dataset.prev = newLang;
            elements.statusLoader.style.display = 'block';

            elements.statusLoader.style.display = 'none';
        };

        function toggleZoom() {
            if (state.zoomMode === 'fit') state.zoomMode = 'width';
            else if (state.zoomMode === 'width') state.zoomMode = 'orig';
            else state.zoomMode = 'fit';

        let isChatOpen = false;

            // Update drawer header

        function appendChatMessage(event) {
            const isSelf = event.user === storage.currentUser;
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg ${isSelf ? 'self' : 'other'}`;

            const metaDiv = document.createElement('div');
            metaDiv.className = 'chat-msg-meta';
            const timeSpan = document.createElement('span');
            const date = new Date((event.ts || 0) * 1000);
            timeSpan.textContent = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            metaDiv.appendChild(timeSpan);

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'chat-msg-bubble';
            const rawText = event.text || '';
            bubbleDiv.innerHTML = rawText
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/p(\d+)b(\d+)/gi, (m, p, b) =>
                    `<span class="chat-link" onclick="navigateToPageAndBlock(${p},${b})">${m}</span>`);

            msgDiv.appendChild(metaDiv);

        async function sendChatMessage(text) {
            if (!text || !storage.isServer || !storage.chatPeer) return;
            const peer = storage.chatPeer;
            // Optimistic render: show the message immediately so the user has
            // instant feedback. The server's SSE echo is deduped by ts+text.
            const optimisticEvent = {
                type: 'chat',

                to: peer,
                text,
                ts: Date.now() / 1000
            };
            if (!storage.dmHistory[peer]) storage.dmHistory[peer] = [];
            storage.dmHistory[peer].push(optimisticEvent);
            appendChatMessage(optimisticEvent);

            try {
                const resp = await fetch(`api/collab/chat?t=${storage.token}&user=${encodeURIComponent(storage.currentUser)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, to: peer })

        // Copy text to the clipboard with a fallback for non-secure contexts (LAN HTTP

        async function copyToClipboard(text) {
            let ok = false;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    ok = true;
                }
            } catch (e) { /* fall through to legacy path */ }
            if (!ok) {

                    const ta = document.createElement('textarea');
                    ta.value = text;

                    ta.style.top = '-9999px';
                    document.body.appendChild(ta);

                    ok = document.execCommand('copy');

            // Build block -> [{user, text}] for collaborators editing the current page+lang.

            return { x: (e.clientX - r.left) * scale, y: (e.clientY - r.top) * (elements.canvas.height / r.height), scale };
        }
        function hitHandle(rect, x, y, tol) {
            const { minX, minY, maxX, maxY } = rect, cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
            const H = { nw: [minX, minY], n: [cx, minY], ne: [maxX, minY], w: [minX, cy], e: [maxX, cy], sw: [minX, maxY], s: [cx, maxY], se: [maxX, maxY] };
            for (const k in H) if (Math.abs(x - H[k][0]) <= tol && Math.abs(y - H[k][1]) <= tol) return k;
            return null;
        }
        function hitTestBlock(blocks, x, y) {
            for (let i = blocks.length - 1; i >= 0; i--) {
                const r = effRect(blocks[i]);
                if (x >= r.minX && x <= r.maxX && y >= r.minY && y <= r.maxY) return i;
            }
            return -1;
        }
        function setBlockRect(b, minX, minY, maxX, maxY) {
            minX = Math.max(0, Math.round(minX)); minY = Math.max(0, Math.round(minY));
            maxX = Math.min(elements.canvas.width, Math.round(maxX)); maxY = Math.min(elements.canvas.height, Math.round(maxY));
            if (maxX - minX < 2) maxX = minX + 2;
            if (maxY - minY < 2) maxY = minY + 2;
            const poly = [[minX, minY], [maxX, minY], [maxX, maxY], [minX, maxY]];
            b.polygon = poly; b.lines = [poly]; b.bbox = [minX, minY, maxX - minX, maxY - minY];
        }
        // Task-level box scaling. The editor shows/edits boxes at box_scale (display
        // space), while the stored geometry (polygon/lines/bbox) stays at base size.
        function blockScale(block) {
            if (block && block.scale_exempt) return 1;
            return (storage.currentTask && storage.currentTask.data.box_scale) || 1;
        }
        function effRect(block) {
            const r = getRect(block.polygon);
            const s = blockScale(block);
            if (s === 1) return r;
            const cx = (r.minX + r.maxX) / 2, cy = (r.minY + r.maxY) / 2;
            const hw = (r.maxX - r.minX) / 2 * s, hh = (r.maxY - r.minY) / 2 * s;
            return { minX: cx - hw, minY: cy - hh, maxX: cx + hw, maxY: cy + hh };
        }
        function storeRectFromDisplay(b, dr) {
            const s = blockScale(b);
            let r = dr;
            if (s !== 1) {
                const cx = (dr.minX + dr.maxX) / 2, cy = (dr.minY + dr.maxY) / 2;
                const hw = (dr.maxX - dr.minX) / 2 / s, hh = (dr.maxY - dr.minY) / 2 / s;
                r = { minX: cx - hw, minY: cy - hh, maxX: cx + hw, maxY: cy + hh };
            }
            setBlockRect(b, r.minX, r.minY, r.maxX, r.maxY);
        }
        function createUserBlock(r) {
            const id = 'u' + Date.now().toString(36) + Math.floor(Math.random() * 1000);
            const b = { id, text: '', ocr_text: '', font_size: 24,
                angle: 0, fg_color: [0, 0, 0], bg_color: [255, 255, 255], direction: 'auto', alignment: 'auto',
                prob: 1.0, bg_fill: 'white', user_added: true, fixed_region: true, scale_exempt: false,
                polygon: [], lines: [], bbox: [0, 0, 0, 0] };
            storeRectFromDisplay(b, r);   // r is in display space → stored base = r / box_scale
            b.font_size = Math.max(12, Math.round((b.bbox[3] || 20) * 0.6));
            return b;
        }
        function persistGeometry() {
            savePagesJson().catch(e => showToast('Save failed: ' + e.message));

        function toggleBlockBg(bIndex) {
            const b = storage.currentTask.data.pages[state.currentPageIndex].blocks[bIndex]; if (!b) return;
            // Cycle: none (transparent) → match (region color) → white → none.
            const next = { none: 'match', match: 'white', white: 'none' };
            b.bg_fill = next[b.bg_fill] || 'match';

        // Render an [r,g,b] color array as a CSS color (defaults to black).
        function rgbCss(c) {
            const a = (Array.isArray(c) && c.length >= 3) ? c : [0, 0, 0];
            return `rgb(${a[0]}, ${a[1]}, ${a[2]})`;
        }

        // Count letters/numbers in any script (CJK/kana included); ignores
        // punctuation, symbols and whitespace. Mirrors the backend's _has_real_text.
        function realLen(s) {
            if (!s) return 0;
            const m = String(s).match(/[\p{L}\p{N}]/gu);
            return m ? m.length : 0;
        }
        // Advisory: is the source suspiciously short vs its translation (possible
        // partial OCR / lost source)? Pure hint, no action. Deliberately conservative
        // for non-empty sources: a terse line legitimately expands a lot across
        // languages (e.g. 「は？」 → "What are you talking about?"), and a noisy badge
        // gets ignored. So for s>0 it only fires when a real chunk of source (4+ real
        // chars) is dwarfed by a much longer translation. The fully reliable case —
        // a translation with no real source at all — always shows.
        function isLengthSuspect(source, translation) {
            const s = realLen(source), tt = realLen(translation);
            if (tt === 0) return false;
            if (s === 0) return true;                          // translation but no real source
            return s >= 4 && tt > s * 6 && tt - s >= 24;       // substantial source, hugely dwarfed
        }

        // Palette for the font-color picker: black + white (always offered), then up to
        // 10 of the task's fg_colors. Picking the 10 most-frequent exact colors is no
        // good when a task's text is all near-black (the swatches look identical), so we
        // instead pick the most-frequent VISUALLY-DISTINCT colors: near-duplicates are
        // collapsed and shades close to black/white are absorbed by the base swatches.
        function taskFontColors() {
            const TOP_N = 10;
            const MIN_DIST = 45;   // RGB distance below which two colors look "the same"
            const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);

            const counts = new Map();   // "r,g,b" -> { color:[r,g,b], n }
            for (const p of (storage.currentTask.data.pages || []))
                for (const b of (p.blocks || [])) {
                    const c = b.fg_color;
                    if (Array.isArray(c) && c.length >= 3) {
                        const k = c.slice(0, 3).join(',');
                        const e = counts.get(k) || { color: c.slice(0, 3), n: 0 };
                        e.n++; counts.set(k, e);
                    }
                }
            // Most frequent first, then greedily keep colors that are far enough from the
            // base swatches and from every color already chosen.
            const ranked = [...counts.values()].sort((a, b) => b.n - a.n);
            const base = [[0, 0, 0], [255, 255, 255]];
            const reps = [];
            for (const e of ranked) {
                if (reps.length >= TOP_N) break;
                if (base.some(b => dist(b, e.color) < MIN_DIST)) continue;   // ~black/~white
                if (reps.some(r => dist(r, e.color) < MIN_DIST)) continue;   // ~already picked
                reps.push(e.color);
            }
            return [...base, ...reps];
        }

        function setBlockFgColor(bIndex, color) {

            const pop = document.createElement('div');

        // Clone a block: a same-size, same-color duplicate offset down-right from the
        // original, with its translation copied too. Inserted right after the source.
        function cloneBlockAt(bIndex) {
            const page = storage.currentTask.data.pages[state.currentPageIndex];
            const src = page.blocks[bIndex]; if (!src) return;
            const clone = JSON.parse(JSON.stringify(src));
            clone.id = 'u' + Date.now().toString(36) + Math.floor(Math.random() * 1000);
            clone.user_added = true;
            clone.fixed_region = true;   // keep the clone where we place it
            const OFF = 24;              // down-right offset (base/stored space)
            const r = getRect(src.polygon);
            setBlockRect(clone, r.minX + OFF, r.minY + OFF, r.maxX + OFF, r.maxY + OFF);
            page.blocks.splice(bIndex + 1, 0, clone);

            // Copy the current-language translation so the clone is a full duplicate.
            const srcTrans = storage.currentTask.translations[src.id];
            if (srcTrans && (srcTrans.text || '').length) {
                storage.currentTask.translations[clone.id] = {
                    text: srcTrans.text, edited: true,
                    author: storage.currentUser || srcTrans.author
                };
                storage.markBlockDirty(clone.id);
            }

            persistGeometry();
            storage.saveTranslations().catch(() => {});
            render(); updateCurrentPageProgress();
            // Re-select the clone (block order may be re-sorted on render).
            const ni = page.blocks.findIndex(x => x.id === clone.id);
            if (ni >= 0) selectBlock(ni);
        }
        function deleteBlockAt(bIndex) {

            // Record the deletion so the block-level save tells the server to drop it.
            storage.dirtyBlocks.delete(b.id);
            storage.deletedBlocks.add(b.id);
            page.blocks.splice(bIndex, 1);
            if (state.selectedBlockIndex >= page.blocks.length) state.selectedBlockIndex = page.blocks.length - 1;
            persistGeometry(); storage.saveTranslations().catch(() => {});
            render(); updateCurrentPageProgress();
        }

                ['?', t('scHelp')],
            ];
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'shortcuts-overlay';
            const panel = document.createElement('div');
            panel.className = 'modal-panel';
            const title = document.createElement('h3');
            title.textContent = t('titleShortcuts');
            panel.appendChild(title);
            rows.forEach(([k, v]) => {
                const r = document.createElement('div'); r.className = 'modal-row';
                const kk = document.createElement('div'); kk.className = 'modal-key'; kk.textContent = k; kk.style.flex = '0 0 130px';
                const vv = document.createElement('div'); vv.className = 'modal-val'; vv.textContent = v;
                r.appendChild(kk); r.appendChild(vv); panel.appendChild(r);
            });
            const actions = document.createElement('div'); actions.className = 'modal-actions';
            const closeBtn = document.createElement('button'); closeBtn.textContent = t('infoClose');
            actions.appendChild(closeBtn); panel.appendChild(actions);
            overlay.appendChild(panel);
            const onKey = (e) => { if (e.key === 'Escape') close(); };
            function close() { overlay.remove(); document.removeEventListener('keydown', onKey); }
            closeBtn.onclick = close;
            overlay.onclick = (e) => { if (e.target === overlay) close(); };
            document.addEventListener('keydown', onKey);
            document.body.appendChild(overlay);
        }
        document.getElementById('btn-help').onclick = showShortcutsHelp;

        // Cross-page search & replace over the current task's translations. Purely
        // client-side (operates on in-memory translations), so it works the same in
        // local and server modes; saving goes through the existing saveTranslations().
        function showSearchReplace() {
            if (!storage.currentTask) { showToast(t('emptySelectPage'), 'error'); return; }
            if (document.getElementById('search-overlay')) return;

            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.id = 'search-overlay';
            const panel = document.createElement('div');
            panel.className = 'modal-panel';
            panel.style.width = '640px';

            const title = document.createElement('h3');
            title.textContent = t('titleSearch');
            panel.appendChild(title);

            const ctrls = document.createElement('div');
            ctrls.style.cssText = 'display:flex;flex-direction:column;gap:8px;margin-bottom:10px;';
            const findInput = document.createElement('input');
            findInput.type = 'text'; findInput.placeholder = t('searchFindPh');
            const replaceInput = document.createElement('input');
            replaceInput.type = 'text'; replaceInput.placeholder = t('searchReplacePh');
            [findInput, replaceInput].forEach(i => i.style.cssText = 'width:100%;padding:7px 8px;background:var(--bg-hover);color:var(--text-primary);border:1px solid var(--border);border-radius:4px;font-size:0.85rem;');
            const origRow = document.createElement('label');
            origRow.style.cssText = 'display:flex;align-items:center;gap:6px;font-size:0.8rem;color:var(--text-secondary);';
            const origCb = document.createElement('input'); origCb.type = 'checkbox';
            origRow.appendChild(origCb); origRow.appendChild(document.createTextNode(t('searchInOrig')));
            ctrls.appendChild(findInput); ctrls.appendChild(replaceInput); ctrls.appendChild(origRow);
            panel.appendChild(ctrls);

            const counter = document.createElement('div'); counter.className = 'diff-count';
            counter.style.margin = '0 0 6px'; panel.appendChild(counter);
            const list = document.createElement('div'); list.className = 'diff-list'; panel.appendChild(list);

            let matches = []; // [{ id, page, block }]

            function collect() {
                const find = findInput.value;
                list.innerHTML = ''; matches = [];
                if (!find) { counter.textContent = ''; return; }
                const searchOrig = origCb.checked;
                (storage.currentTask.data.pages || []).forEach((p, pi) => {
                    (p.blocks || []).forEach((b, bi) => {
                        const tx = storage.currentTask.translations[b.id]?.text || '';
                        const og = b.text || '';
                        const inT = tx.includes(find);
                        const inO = searchOrig && og.includes(find);
                        if (!inT && !inO) return;
                        matches.push({ id: b.id, page: pi, block: bi });
                        const item = document.createElement('div'); item.className = 'diff-item';
                        const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true; item._cb = cb;
                        const bodyEl = document.createElement('div'); bodyEl.className = 'diff-body'; bodyEl.style.cursor = 'pointer';
                        const head = document.createElement('div'); head.className = 'diff-head';
                        head.textContent = `P${pi + 1} · #${bi + 1}` + (inT ? '' : ` · ${t('labelOrig')}`);
                        const snip = document.createElement('div'); snip.className = 'diff-cur';
                        snip.style.color = 'var(--text-primary)';
                        snip.textContent = (inT ? tx : og).replace(/\n/g, ' ');
                        bodyEl.appendChild(head); bodyEl.appendChild(snip);
                        // Jump to the block (resolve by id after navigation in case the
                        // target page re-sorts its blocks on first view).
                        const pidx = pi, bid = b.id;
                        bodyEl.onclick = () => {
                            close(); selectPage(pidx);
                            setTimeout(() => {
                                const blocks = storage.currentTask.data.pages[pidx].blocks || [];
                                const idx = blocks.findIndex(x => x.id === bid);
                                if (idx >= 0) selectBlock(idx);
                            }, 90);
                        };
                        item.appendChild(cb); item.appendChild(bodyEl);
                        list.appendChild(item);
                    });
                });
                counter.textContent = matches.length ? `(${matches.length})` : t('searchNoMatch');
            }
            findInput.oninput = collect;
            origCb.onchange = collect;

            const actions = document.createElement('div'); actions.className = 'modal-actions';
            const replSel = document.createElement('button'); replSel.textContent = t('searchReplaceSel');
            const replAll = document.createElement('button'); replAll.textContent = t('searchReplaceAll');
            const closeBtn = document.createElement('button'); closeBtn.textContent = t('infoClose'); closeBtn.style.background = 'var(--bg-hover)';
            // View-only users can search & jump, but not replace.
            if (!storage.viewOnly) { actions.appendChild(replSel); actions.appendChild(replAll); }
            actions.appendChild(closeBtn);
            panel.appendChild(actions);

            async function doReplace(onlySelected) {
                const find = findInput.value;
                if (!find) return;
                const repl = replaceInput.value;
                const rows = Array.from(list.children);
                // Replace only in translations (originals are source — never edited).
                let n = 0;
                matches.forEach((m, idx) => {
                    if (onlySelected && rows[idx] && !rows[idx]._cb.checked) return;
                    const cur = storage.currentTask.translations[m.id]?.text || '';
                    if (!cur.includes(find)) return;
                    const next = cur.split(find).join(repl);
                    if (next !== cur) {
                        const prev = storage.currentTask.translations[m.id] || {};
                        storage.currentTask.translations[m.id] = { text: next, edited: true, author: prev.author, rev: prev.rev };
                        storage.markBlockDirty(m.id);
                        n++;
                    }
                });
                if (!n) { showToast(t('searchNoMatch'), 'error'); return; }
                try { await storage.saveTranslations(); setDirty(false); }
                catch (e) { if (e.message !== "UNAUTHORIZED") showToast('Save failed: ' + e.message, 'error'); }
                render(); refreshAllPageProgress();
                showToast(t('searchDone', { n }), 'success');
                close();
            }
            replSel.onclick = () => doReplace(true);
            replAll.onclick = () => doReplace(false);

            overlay.appendChild(panel);
            const onKey = (e) => { if (e.key === 'Escape') close(); };
            function close() { overlay.remove(); document.removeEventListener('keydown', onKey); }
            closeBtn.onclick = close;
            overlay.onclick = (e) => { if (e.target === overlay) close(); };
            document.addEventListener('keydown', onKey);
            document.body.appendChild(overlay);
            findInput.focus();
        }
        document.getElementById('btn-search').onclick = showSearchReplace;

        elements.boxScale.onchange = () => {
            if (!storage.currentTask) return;
            let v = parseFloat(elements.boxScale.value);
            if (!isFinite(v) || v <= 0) v = 1;
            v = Math.min(5, Math.max(0.5, Math.round(v * 100) / 100));
            elements.boxScale.value = v;
            storage.currentTask.data.box_scale = v;
            persistGeometry();
            renderPage();
        };

        // Effective render params: per-task override (pages.json) else config.toml.
        function effMinFs() {
            const d = storage.currentTask && storage.currentTask.data;
            let v = (d && d.font_size_minimum != null) ? d.font_size_minimum
                : (globalConfig && globalConfig.render ? globalConfig.render.font_size_minimum : undefined);
            if (v === -1) return Math.max(1, Math.round((elements.canvas.width + elements.canvas.height) / 200));
            if (v == null) return 8;
            return Math.max(1, v);
        }
        function effExpand() {
            const d = storage.currentTask && storage.currentTask.data;
            let v = (d && d.font_size_minimum_expand_limit != null) ? d.font_size_minimum_expand_limit
                : (globalConfig && globalConfig.render ? globalConfig.render.font_size_minimum_expand_limit : undefined);
            if (v == null) return 1.5;
            return Math.max(1.0, v);
        }
        // Set/clear a per-task render override (empty input → inherit config.toml).
        function setTaskOverride(key, raw, isFloat) {
            if (!storage.currentTask) return;
            const d = storage.currentTask.data;
            const s = String(raw).trim();
            if (s === '') { delete d[key]; }
            else { const v = isFloat ? parseFloat(s) : parseInt(s); if (isFinite(v)) d[key] = v; }
            persistGeometry();
            renderPage();
        }
        elements.taskMinFont.onchange = () => setTaskOverride('font_size_minimum', elements.taskMinFont.value, false);
        elements.taskExpand.onchange = () => setTaskOverride('font_size_minimum_expand_limit', elements.taskExpand.value, true);

        const HANDLE_CURSOR = { nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize',
            n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize' };

        // Hover feedback: show resize cursors over the selected block's handles and a
        // move cursor over a block body, so small regions are easy to grab.
        function updateHoverCursor(e) {
            if (!state.editMode || drag || !storage.currentTask || state.currentPageIndex < 0) return;
            const { x, y, scale } = canvasToImg(e);
            const blocks = storage.currentTask.data.pages[state.currentPageIndex].blocks || [];
            let cur = 'crosshair';
            if (state.selectedBlockIndex >= 0 && blocks[state.selectedBlockIndex]) {
                const h = hitHandle(effRect(blocks[state.selectedBlockIndex]), x, y, 8 * scale);
                if (h) cur = HANDLE_CURSOR[h];
            }
            if (cur === 'crosshair' && hitTestBlock(blocks, x, y) !== -1) cur = 'move';
            elements.canvas.style.cursor = cur;
        }
        elements.canvas.addEventListener('mousemove', updateHoverCursor);

        elements.canvas.addEventListener('mousedown', (e) => {
            if (!storage.currentTask || state.currentPageIndex < 0) return;
            const { x, y, scale } = canvasToImg(e);
            const blocks = storage.currentTask.data.pages[state.currentPageIndex].blocks || [];
            if (!state.editMode) {
                const f = hitTestBlock(blocks, x, y);
                if (f !== -1) selectBlock(f);
                return;
            }
            const tol = 8 * scale;
            if (state.selectedBlockIndex >= 0 && blocks[state.selectedBlockIndex]) {
                const r = effRect(blocks[state.selectedBlockIndex]);
                const h = hitHandle(r, x, y, tol);
                if (h) { drag = { type: 'resize', handle: h, blockIndex: state.selectedBlockIndex, orig: r }; elements.canvas.style.cursor = HANDLE_CURSOR[h]; e.preventDefault(); return; }
            }
            const f = hitTestBlock(blocks, x, y);
            if (f !== -1) {
                selectBlock(f);
                drag = { type: 'move', blockIndex: f, startX: x, startY: y, orig: effRect(blocks[f]) };
                elements.canvas.style.cursor = 'move';
                e.preventDefault(); return;
            }
            drag = { type: 'new', startX: x, startY: y, cur: { minX: x, minY: y, maxX: x, maxY: y } };
            elements.canvas.style.cursor = 'crosshair';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!drag) return;
            const { x, y } = canvasToImg(e);
            const blocks = storage.currentTask.data.pages[state.currentPageIndex].blocks;
            if (drag.type === 'resize') {
                let { minX, minY, maxX, maxY } = drag.orig;
                if (drag.handle.includes('w')) minX = x;
                if (drag.handle.includes('e')) maxX = x;
                if (drag.handle.includes('n')) minY = y;
                if (drag.handle.includes('s')) maxY = y;
                storeRectFromDisplay(blocks[drag.blockIndex], { minX: Math.min(minX, maxX), minY: Math.min(minY, maxY), maxX: Math.max(minX, maxX), maxY: Math.max(minY, maxY) });
                redraw();
            } else if (drag.type === 'move') {
                const dx = x - drag.startX, dy = y - drag.startY;
                storeRectFromDisplay(blocks[drag.blockIndex], { minX: drag.orig.minX + dx, minY: drag.orig.minY + dy, maxX: drag.orig.maxX + dx, maxY: drag.orig.maxY + dy });
                redraw();
            } else if (drag.type === 'new') {
                drag.cur = { minX: Math.min(drag.startX, x), minY: Math.min(drag.startY, y), maxX: Math.max(drag.startX, x), maxY: Math.max(drag.startY, y) };
                redraw();
                ctx.save(); ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
                ctx.strokeRect(drag.cur.minX, drag.cur.minY, drag.cur.maxX - drag.cur.minX, drag.cur.maxY - drag.cur.minY);
                ctx.restore();
            }
        });

        document.addEventListener('mouseup', () => {
            if (!drag) return;
            const page = storage.currentTask.data.pages[state.currentPageIndex];
            if (drag.type === 'new') {
                const r = drag.cur;
                if ((r.maxX - r.minX) > 5 && (r.maxY - r.minY) > 5) {
                    page.blocks.push(createUserBlock(r));
                    state.selectedBlockIndex = page.blocks.length - 1;
                    persistGeometry(); render(); updateCurrentPageProgress();
                } else {
                    // Click (no real drag) on empty space → deselect, so the striking
                    // selection border clears and you can see the result cleanly.
                    state.selectedBlockIndex = -1;
                    render();
                }
            } else if (drag.type === 'resize' || drag.type === 'move') {
                const b = page.blocks[drag.blockIndex];
                if (b) { b.fixed_region = true; persistGeometry(); renderBlockEditors(); }
            }
            drag = null;
            if (state.editMode) elements.canvas.style.cursor = 'crosshair';
        });


        function navigateTaskList(direction) {
            const items = Array.from(elements.taskList.children);
            if (items.length === 0) return;
            let activeIdx = items.findIndex(el => el.classList.contains('active'));
            if (activeIdx === -1) {
                items[0].click();
                return;
            }
            let nextIdx = activeIdx + direction;
            if (nextIdx >= 0 && nextIdx < items.length) {
                items[nextIdx].click();
            }
        }

        document.getElementById('task-list').addEventListener('click', () => { state.activeFocusArea = 'tasks'; });
        document.getElementById('page-list').addEventListener('click', () => { state.activeFocusArea = 'pages'; });
        document.getElementById('blocks-container').addEventListener('click', () => { state.activeFocusArea = 'editor'; });
        document.getElementById('viewport').addEventListener('click', () => { state.activeFocusArea = 'canvas'; });

        document.addEventListener('focusin', (e) => {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
                state.activeFocusArea = 'editor';
            }
        });

        document.addEventListener('keydown', (e) => {
            const isInput = e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT';

            if (e.key === '?' && !isInput) {
                e.preventDefault();
                showShortcutsHelp();
                return;
            }

            if (e.key === 'ArrowLeft') {
                if (isInput && !e.altKey) return;
                e.preventDefault();
                selectPage(state.currentPageIndex - 1);
            } else if (e.key === 'ArrowRight') {
                if (isInput && !e.altKey) return;
                e.preventDefault();
                selectPage(state.currentPageIndex + 1);
            } else if (e.key === 'ArrowUp') {
                if (state.activeFocusArea === 'editor' && isInput) {
                    if (e.target.selectionStart !== 0) return;
                    e.preventDefault();
                    selectBlock(state.selectedBlockIndex - 1);
                } else if (state.activeFocusArea === 'tasks') {
                    e.preventDefault();
                    navigateTaskList(-1);
                } else if (state.activeFocusArea === 'pages') {
                    e.preventDefault();
                    selectPage(state.currentPageIndex - 1);
                } else if (state.zoomMode !== 'fit') {
                    e.preventDefault();
                    document.getElementById('canvas-container').scrollTop -= 60;
                }
            } else if (e.key === 'ArrowDown') {
                if (state.activeFocusArea === 'editor' && isInput) {
                    if (e.target.selectionEnd !== e.target.value.length) return;
                    e.preventDefault();
                    selectBlock(state.selectedBlockIndex + 1);
                } else if (state.activeFocusArea === 'tasks') {
                    e.preventDefault();
                    navigateTaskList(1);
                } else if (state.activeFocusArea === 'pages') {
                    e.preventDefault();
                    selectPage(state.currentPageIndex + 1);
                } else if (state.zoomMode !== 'fit') {
                    e.preventDefault();
                    document.getElementById('canvas-container').scrollTop += 60;
                }
            } else if (isInput && e.target.tagName === 'TEXTAREA' && (e.altKey || e.ctrlKey) && (e.code === 'KeyZ' || e.key === 'z' || e.key === 'Z' || e.key === 'Ω' || e.key === '¸')) {
                e.preventDefault();
                e.stopPropagation();
                e.target.value = '';
                e.target.dispatchEvent(new Event('input'));
                showToast(currentLang === 'zh' ? "已清空译文" : "Translation cleared");
            }
        });

        init();
    </script>
</body>

</html>
