        // ===== Region editing: draw / move / resize block boxes =====
        let editMode = false;
        let currentImageEl = null;   // cached page image, set by renderPage()
        let drag = null;             // active drag operation

        function _dispScale() {
            const r = elements.canvas.getBoundingClientRect();
            return r.width ? (elements.canvas.width / r.width) : 1;
        }
        function canvasToImg(e) {
            const r = elements.canvas.getBoundingClientRect();
            const scale = r.width ? (elements.canvas.width / r.width) : 1;
            return { x: (e.clientX - r.left) * scale, y: (e.clientY - r.top) * (elements.canvas.height / r.height), scale };
        }
        function hitHandle(rect, x, y, tol) {
            const { minX, minY, maxX, maxY } = rect, cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
            const H = { nw: [minX, minY], n: [cx, minY], ne: [maxX, minY], w: [minX, cy], e: [maxX, cy], sw: [minX, maxY], s: [cx, maxY], se: [maxX, maxY] };
            for (const k in H) if (Math.abs(x - H[k][0]) <= tol && Math.abs(y - H[k][1]) <= tol) return k;
            return null;
        }
        function hitTestBlock(blocks, x, y) {
            for (let i = blocks.length - 1; i >= 0; i--) {
                const r = effRect(blocks[i]);
                if (x >= r.minX && x <= r.maxX && y >= r.minY && y <= r.maxY) return i;
            }
            return -1;
        }
        function setBlockRect(b, minX, minY, maxX, maxY) {
            minX = Math.max(0, Math.round(minX)); minY = Math.max(0, Math.round(minY));
            maxX = Math.min(elements.canvas.width, Math.round(maxX)); maxY = Math.min(elements.canvas.height, Math.round(maxY));
            if (maxX - minX < 2) maxX = minX + 2;
            if (maxY - minY < 2) maxY = minY + 2;
            const poly = [[minX, minY], [maxX, minY], [maxX, maxY], [minX, maxY]];
            b.polygon = poly; b.lines = [poly]; b.bbox = [minX, minY, maxX - minX, maxY - minY];
        }
        // Task-level box scaling. The editor shows/edits boxes at box_scale (display
        // space), while the stored geometry (polygon/lines/bbox) stays at base size.
        function blockScale(block) {
            if (block && block.scale_exempt) return 1;
            return (storage.currentTask && storage.currentTask.data.box_scale) || 1;
        }
        function effRect(block) {
            const r = getRect(block.polygon);
            const s = blockScale(block);
            if (s === 1) return r;
            const cx = (r.minX + r.maxX) / 2, cy = (r.minY + r.maxY) / 2;
            const hw = (r.maxX - r.minX) / 2 * s, hh = (r.maxY - r.minY) / 2 * s;
            return { minX: cx - hw, minY: cy - hh, maxX: cx + hw, maxY: cy + hh };
        }
        function storeRectFromDisplay(b, dr) {
            const s = blockScale(b);
            let r = dr;
            if (s !== 1) {
                const cx = (dr.minX + dr.maxX) / 2, cy = (dr.minY + dr.maxY) / 2;
                const hw = (dr.maxX - dr.minX) / 2 / s, hh = (dr.maxY - dr.minY) / 2 / s;
                r = { minX: cx - hw, minY: cy - hh, maxX: cx + hw, maxY: cy + hh };
            }
            setBlockRect(b, r.minX, r.minY, r.maxX, r.maxY);
        }
        function createUserBlock(r) {
            const id = 'u' + Date.now().toString(36) + Math.floor(Math.random() * 1000);
            const b = { id, text: '', ocr_text: '', font_size: 24,
                angle: 0, fg_color: [0, 0, 0], bg_color: [255, 255, 255], direction: 'auto', alignment: 'auto',
                prob: 1.0, bg_fill: 'white', user_added: true, fixed_region: true, scale_exempt: false,
                polygon: [], lines: [], bbox: [0, 0, 0, 0] };
            storeRectFromDisplay(b, r);   // r is in display space → stored base = r / box_scale
            b.font_size = Math.max(12, Math.round((b.bbox[3] || 20) * 0.6));
            return b;
        }
        function persistGeometry() {
            savePagesJson().catch(e => showToast('Save failed: ' + e.message));
        }
        function toggleBlockBg(bIndex) {
            const b = storage.currentTask.data.pages[currentPageIndex].blocks[bIndex]; if (!b) return;
            b.bg_fill = (b.bg_fill === 'white') ? 'none' : 'white';
            persistGeometry(); renderBlockEditors(); renderPage();
        }
        function deleteBlockAt(bIndex) {
            const page = storage.currentTask.data.pages[currentPageIndex];
            const b = page.blocks[bIndex]; if (!b) return;
            if (!confirm(t('confirmDeleteBlock'))) return;
            delete storage.currentTask.translations[b.id];
            page.blocks.splice(bIndex, 1);
            if (selectedBlockIndex >= page.blocks.length) selectedBlockIndex = page.blocks.length - 1;
            persistGeometry(); storage.saveTranslations().catch(() => {});
            renderBlockEditors(); renderPage();
        }
        function toggleEditMode() {
            editMode = !editMode;
            elements.btnEditRegion.classList.toggle('active', editMode);
            elements.canvas.style.cursor = editMode ? 'crosshair' : 'default';
            showToast(t(editMode ? 'editModeOn' : 'editModeOff'));
            renderPage();
        }
        elements.btnEditRegion.onclick = toggleEditMode;

        elements.boxScale.onchange = () => {
            if (!storage.currentTask) return;
            let v = parseFloat(elements.boxScale.value);
            if (!isFinite(v) || v <= 0) v = 1;
            v = Math.min(5, Math.max(0.5, Math.round(v * 100) / 100));
            elements.boxScale.value = v;
            storage.currentTask.data.box_scale = v;
            persistGeometry();
            renderPage();
        };

        // Effective render params: per-task override (pages.json) else config.toml.
        function effMinFs() {
            const d = storage.currentTask && storage.currentTask.data;
            let v = (d && d.font_size_minimum != null) ? d.font_size_minimum
                : (globalConfig && globalConfig.render ? globalConfig.render.font_size_minimum : undefined);
            if (v === -1) return Math.max(1, Math.round((elements.canvas.width + elements.canvas.height) / 200));
            if (v == null) return 8;
            return Math.max(1, v);
        }
        function effExpand() {
            const d = storage.currentTask && storage.currentTask.data;
            let v = (d && d.font_size_minimum_expand_limit != null) ? d.font_size_minimum_expand_limit
                : (globalConfig && globalConfig.render ? globalConfig.render.font_size_minimum_expand_limit : undefined);
            if (v == null) return 1.5;
            return Math.max(1.0, v);
        }
        // Set/clear a per-task render override (empty input → inherit config.toml).
        function setTaskOverride(key, raw, isFloat) {
            if (!storage.currentTask) return;
            const d = storage.currentTask.data;
            const s = String(raw).trim();
            if (s === '') { delete d[key]; }
            else { const v = isFloat ? parseFloat(s) : parseInt(s); if (isFinite(v)) d[key] = v; }
            persistGeometry();
            renderPage();
        }
        elements.taskMinFont.onchange = () => setTaskOverride('font_size_minimum', elements.taskMinFont.value, false);
        elements.taskExpand.onchange = () => setTaskOverride('font_size_minimum_expand_limit', elements.taskExpand.value, true);

        const HANDLE_CURSOR = { nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize',
            n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize' };

        // Hover feedback: show resize cursors over the selected block's handles and a
        // move cursor over a block body, so small regions are easy to grab.
        function updateHoverCursor(e) {
            if (!editMode || drag || !storage.currentTask || currentPageIndex < 0) return;
            const { x, y, scale } = canvasToImg(e);
            const blocks = storage.currentTask.data.pages[currentPageIndex].blocks || [];
            let cur = 'crosshair';
            if (selectedBlockIndex >= 0 && blocks[selectedBlockIndex]) {
                const h = hitHandle(effRect(blocks[selectedBlockIndex]), x, y, 8 * scale);
                if (h) cur = HANDLE_CURSOR[h];
            }
            if (cur === 'crosshair' && hitTestBlock(blocks, x, y) !== -1) cur = 'move';
            elements.canvas.style.cursor = cur;
        }
        elements.canvas.addEventListener('mousemove', updateHoverCursor);

        elements.canvas.addEventListener('mousedown', (e) => {
            if (!storage.currentTask || currentPageIndex < 0) return;
            const { x, y, scale } = canvasToImg(e);
            const blocks = storage.currentTask.data.pages[currentPageIndex].blocks || [];
            if (!editMode) {
                const f = hitTestBlock(blocks, x, y);
                if (f !== -1) selectBlock(f);
                return;
            }
            const tol = 8 * scale;
            if (selectedBlockIndex >= 0 && blocks[selectedBlockIndex]) {
                const r = effRect(blocks[selectedBlockIndex]);
                const h = hitHandle(r, x, y, tol);
                if (h) { drag = { type: 'resize', handle: h, blockIndex: selectedBlockIndex, orig: r }; elements.canvas.style.cursor = HANDLE_CURSOR[h]; e.preventDefault(); return; }
            }
            const f = hitTestBlock(blocks, x, y);
            if (f !== -1) {
                selectBlock(f);
                drag = { type: 'move', blockIndex: f, startX: x, startY: y, orig: effRect(blocks[f]) };
                elements.canvas.style.cursor = 'move';
                e.preventDefault(); return;
            }
            drag = { type: 'new', startX: x, startY: y, cur: { minX: x, minY: y, maxX: x, maxY: y } };
            elements.canvas.style.cursor = 'crosshair';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!drag) return;
            const { x, y } = canvasToImg(e);
            const blocks = storage.currentTask.data.pages[currentPageIndex].blocks;
            if (drag.type === 'resize') {
                let { minX, minY, maxX, maxY } = drag.orig;
                if (drag.handle.includes('w')) minX = x;
                if (drag.handle.includes('e')) maxX = x;
                if (drag.handle.includes('n')) minY = y;
                if (drag.handle.includes('s')) maxY = y;
                storeRectFromDisplay(blocks[drag.blockIndex], { minX: Math.min(minX, maxX), minY: Math.min(minY, maxY), maxX: Math.max(minX, maxX), maxY: Math.max(minY, maxY) });

            } else if (drag.type === 'move') {
                const dx = x - drag.startX, dy = y - drag.startY;
                storeRectFromDisplay(blocks[drag.blockIndex], { minX: drag.orig.minX + dx, minY: drag.orig.minY + dy, maxX: drag.orig.maxX + dx, maxY: drag.orig.maxY + dy });
                redraw();
            } else if (drag.type === 'new') {
                drag.cur = { minX: Math.min(drag.startX, x), minY: Math.min(drag.startY, y), maxX: Math.max(drag.startX, x), maxY: Math.max(drag.startY, y) };

                ctx.save(); ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);

                ctx.restore();
            }
        });

        document.addEventListener('mouseup', () => {
            if (!drag) return;
            const page = storage.currentTask.data.pages[currentPageIndex];
            if (drag.type === 'new') {
                const r = drag.cur;
                if ((r.maxX - r.minX) > 5 && (r.maxY - r.minY) > 5) {
                    page.blocks.push(createUserBlock(r));

                } else {

                    // selection border clears and you can see the result cleanly.

            } else if (drag.type === 'resize' || drag.type === 'move') {
                const b = page.blocks[drag.blockIndex];
                if (b) { b.fixed_region = true; persistGeometry(); renderBlockEditors(); }
            }
            drag = null;
            if (editMode) elements.canvas.style.cursor = 'crosshair';
        });

        let activeFocusArea = 'pages';

        function navigateTaskList(direction) {
            const items = Array.from(elements.taskList.children);
            if (items.length === 0) return;
            let activeIdx = items.findIndex(el => el.classList.contains('active'));
            if (activeIdx === -1) {
                items[0].click();

        document.getElementById('task-list').addEventListener('click', () => { activeFocusArea = 'tasks'; });
        document.getElementById('page-list').addEventListener('click', () => { activeFocusArea = 'pages'; });
        document.getElementById('blocks-container').addEventListener('click', () => { activeFocusArea = 'editor'; });
        document.getElementById('viewport').addEventListener('click', () => { activeFocusArea = 'canvas'; });

        document.addEventListener('focusin', (e) => {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {

        });

        document.addEventListener('keydown', (e) => {
            const isInput = e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT';

            if (e.key === 'ArrowLeft') {
                if (isInput && !e.altKey) return;
                e.preventDefault();
                selectPage(currentPageIndex - 1);
            } else if (e.key === 'ArrowRight') {
                if (isInput && !e.altKey) return;
                e.preventDefault();
                selectPage(currentPageIndex + 1);
            } else if (e.key === 'ArrowUp') {
                if (activeFocusArea === 'editor' && isInput) {
                    if (e.target.selectionStart !== 0) return;
                    e.preventDefault();
                    selectBlock(selectedBlockIndex - 1);
                } else if (activeFocusArea === 'tasks') {
                    e.preventDefault();
                    navigateTaskList(-1);
                } else if (activeFocusArea === 'pages') {
                    e.preventDefault();
                    selectPage(currentPageIndex - 1);
                } else if (zoomMode !== 'fit') {
                    e.preventDefault();
                    document.getElementById('canvas-container').scrollTop -= 60;
                }
            } else if (e.key === 'ArrowDown') {
                if (activeFocusArea === 'editor' && isInput) {
                    if (e.target.selectionEnd !== e.target.value.length) return;
                    e.preventDefault();
                    selectBlock(selectedBlockIndex + 1);
                } else if (activeFocusArea === 'tasks') {
                    e.preventDefault();
                    navigateTaskList(1);
                } else if (activeFocusArea === 'pages') {
                    e.preventDefault();
                    selectPage(currentPageIndex + 1);
                } else if (zoomMode !== 'fit') {
                    e.preventDefault();
                    document.getElementById('canvas-container').scrollTop += 60;
                }
            } else if (isInput && e.target.tagName === 'TEXTAREA' && (e.altKey || e.ctrlKey) && (e.code === 'KeyZ' || e.key === 'z' || e.key === 'Z' || e.key === 'Ω' || e.key === '¸')) {
                e.preventDefault();
                e.stopPropagation();
                e.target.value = '';
                e.target.dispatchEvent(new Event('input'));
                showToast(currentLang === 'zh' ? "已清空译文" : "Translation cleared");
            }
        });

        init();
    </script>
</body>

</html>
