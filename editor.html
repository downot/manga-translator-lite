                        if (state.currentPageIndex !== -1) {
                            renderPage();
                        }
                    }
                } catch (e) {
                    console.error("Failed to load local config:", e);
                }
            },

            collabSource: null,
            collabActive: false,
            collabHeartbeat: null, // setInterval id for periodic presence rebroadcast
            lastBlockId: null,     // last block reported via sendCollabAction (for heartbeat)
            activeCollaborators: [],
            chatPeer: null,       // username of the open DM conversation
            dmUnread: {},         // username -> unread count
            dmHistory: {},        // username -> [{user,to,text,ts}]
            dmLastRead: {},       // peer -> last-read epoch seconds (persisted)

            _lastReadKey() {
                return 'dm-lastread-' + (this.currentUser || '');
            },
            loadLastRead() {
                try {
                    const raw = localStorage.getItem(this._lastReadKey());
                    this.dmLastRead = raw ? JSON.parse(raw) : {};
                } catch (e) {
                    this.dmLastRead = {};
                }
            },
            markRead(peer) {
                // Mark the conversation with `peer` read up to now and persist,
                // so replayed history older than this never re-notifies as unread.
                this.dmLastRead[peer] = Date.now() / 1000;
                this.dmUnread[peer] = 0;
                try {
                    localStorage.setItem(this._lastReadKey(), JSON.stringify(this.dmLastRead));
                } catch (e) {}
            },

            startCollabStream() {
                if (!this.isServer) return;
                if (this.collabSource) return;
                this.loadLastRead();

                // Immediate heartbeat so we appear online + GET the current roster so
                // we see who's already here without waiting for the first SSE push.
                this.sendCollabAction(this.lastBlockId || null);
                this.fetchPresence();

                this.collabSource = new EventSource(`api/collab/stream?t=${this.token}&user=${encodeURIComponent(this.currentUser)}`);

                this.collabSource.onopen = () => {
                    this.collabActive = true;
                    this.sendCollabAction(this.lastBlockId || null);
                };

                // Presence heartbeat: keeps us in the task's online list. Fires on a
                // timer regardless of SSE state (the heartbeat is an independent POST),
                // so a transient SSE blip never drops our presence. The server expires a
                // user only after _PRESENCE_TTL (~30s) without a heartbeat.
                if (this.collabHeartbeat) clearInterval(this.collabHeartbeat);
                this.collabHeartbeat = setInterval(() => {
                    this.sendCollabAction(this.lastBlockId || null);
                }, 10000);

                this.collabSource.onmessage = (e) => {
                    try {
                        const event = JSON.parse(e.data);
                        if (event.type === 'presence') {
                            this.activeCollaborators = event.users || [];
                            redrawActiveCollaborators();
                            updateEditingIndicators();
                        } else if (event.type === 'save') {
                            if (event.lang === elements.targetLangSelect.value && event.mtime > this.lastMtime) {
                                this.syncTranslations(event.mtime);
                            }
                        } else if (event.type === 'struct') {
                            // Another user changed pages.json (region edit / page delete).
                            // Ignore our own echo; reload structure (deferred if we're
                            // mid region-edit so we don't lose in-progress changes).
                            if (event.by === this.currentUser) return;
                            if (state.editMode) {
                                this.pendingStructReload = true;
                            } else {
                                this.reloadStructure();
                            }
                        } else if (event.type === 'cursor') {
                            if (event.user === this.currentUser) return;
                            if (event.block) {
                                this.liveCursors[event.user] = {
                                    page: event.page, block: event.block,
                                    lang: event.lang, text: event.text || '', ts: Date.now()
                                };
                            } else {
                                delete this.liveCursors[event.user];   // blur / cleared
                            }
                            updateEditingIndicators();
                        } else if (event.type === 'chat') {
                            const me = this.currentUser;
                            // "peer" is the other person in this DM
                            const peer = event.user === me ? event.to : event.user;
                            if (!this.dmHistory[peer]) this.dmHistory[peer] = [];
                            if (event.user === me) {
                                // Self-echo dedup: our optimistic copy has a client ts (no
                                // server id), so match on text + ts within 2s to avoid a
                                // duplicate of the message we already rendered on send.
                                const dup = this.dmHistory[peer].some(m =>
                                    m.user === me && m.text === event.text &&
                                    Math.abs((m.ts || 0) - (event.ts || 0)) < 2);
                                if (dup) return;
                            } else {
                                // Received-message dedup: every reconnect replays the full
                                // history, so skip anything we've already stored. Prefer the
                                // server-assigned id; fall back to a stable content key for
                                // servers that don't stamp one (e.g. server.py).
                                const key = m => (m.id != null)
                                    ? 'id:' + m.id
                                    : [m.user, m.to, m.ts, m.text].join('|');
                                const k = key(event);
                                if (this.dmHistory[peer].some(m => key(m) === k)) return;
                            }
                            this.dmHistory[peer].push(event);
                            if (isChatOpen && this.chatPeer === peer) {
                                appendChatMessage(event);
                                this.markRead(peer);   // keep the open conversation read
                            } else if (event.user !== me) {
                                // Only count as unread if the message is newer than the
                                // last time this user read this conversation. Replayed
                                // history older than that (already read) is ignored.
                                const lastRead = this.dmLastRead[peer] || 0;
                                if ((event.ts || 0) > lastRead) {
                                    this.dmUnread[peer] = (this.dmUnread[peer] || 0) + 1;
                                    redrawActiveCollaborators();
                                }
                            }
                        }
                    } catch (err) {
                        console.error("Collab event error:", err);
                    }
                };

                this.collabSource.onerror = (err) => {
                    this.collabActive = false;
                    // Only wipe the collaborator list on a HARD close. A transient blip
                    // leaves EventSource in CONNECTING and it auto-reconnects; keeping the
                    // last-known list (refreshed by the next presence/heartbeat) avoids
                    // avatars flickering away during brief idle disconnects.
                    if (this.collabSource && this.collabSource.readyState === EventSource.CLOSED) {
                        this.stopCollabStream();
                        setTimeout(() => {
                            if (this.isServer && this.currentUser) {
                                this.startCollabStream();
                            }
                        }, 5000);
                    }
                };
            },

            stopCollabStream() {
                if (this.collabHeartbeat) {
                    clearInterval(this.collabHeartbeat);
                    this.collabHeartbeat = null;
                }
                if (this.collabSource) {
                    this.collabSource.close();
                    this.collabSource = null;
                }
                this.collabActive = false;
                this.activeCollaborators = [];
                this.liveCursors = {};
                redrawActiveCollaborators();
                updateEditingIndicators();
            },

            // Presence heartbeat / state update. Decoupled from the SSE connection:
            // sent on a timer (and on selection changes) so the server keeps us online
            // even while the SSE stream is mid-reconnect. Guarded on identity, not on
            // collabActive, so a transient SSE blip doesn't suspend the heartbeat.
            async sendCollabAction(blockId = null) {
                if (!this.isServer || !this.token || !this.currentUser) return;
                this.lastBlockId = blockId;   // remembered so the heartbeat can resend it
                try {
                    await fetch(`api/collab/action?t=${this.token}&user=${encodeURIComponent(this.currentUser)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            page: state.currentPageIndex,
                            block: blockId,
                            lang: elements.targetLangSelect.value
                        })
                    });
                } catch (e) {}
            },

            // Explicit "leave" so we vanish from a task's online list immediately on
            // task switch / page unload, instead of lingering until the TTL expires.
            sendLeave(token) {
                const tk = token || this.token;
                if (!this.isServer || !tk || !this.currentUser) return;
                const url = `api/collab/action?t=${tk}&user=${encodeURIComponent(this.currentUser)}`;
                const body = JSON.stringify({ leave: true });
                try {
                    // sendBeacon survives page unload; fall back to fetch on task switch.
                    if (navigator.sendBeacon) {
                        navigator.sendBeacon(url, new Blob([body], { type: 'application/json' }));
                    } else {
                        fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true });
                    }
                } catch (e) {}
            },

            // GET retrieval of the per-task online list (independent of the SSE push).
            async fetchPresence() {
                if (!this.isServer || !this.token) return;
                try {
                    const r = await fetch(`api/collab/presence?t=${this.token}`);
                    if (!r.ok) return;
                    const data = await r.json();
                    this.activeCollaborators = data.users || [];
                    redrawActiveCollaborators();
                    updateEditingIndicators();
                } catch (e) {}
            },

            async syncTranslations(serverMtime) {
                const lang = elements.targetLangSelect.value;
                try {
                    const resp = await fetch(`api/translations?t=${this.token}&lang=${lang}`);
                    if (!resp.ok) return;
                    const serverTrans = await resp.json();

                    let hasChanges = false;
                    for (const blockId in serverTrans) {
                        const serverVal = serverTrans[blockId];
                        if (!serverVal) continue;
                        const localVal = this.currentTask.translations[blockId];

                        if (!localVal) {
                            // New block from a collaborator — adopt it.
                            this.currentTask.translations[blockId] = serverVal;
                            hasChanges = true;
                        } else if (this.dirtyBlocks.has(blockId)) {
                            // We have unsaved edits here. If the server's text now differs
                            // from ours, surface a conflict (don't clobber our work); the
                            // base rev stays so our save will detect the conflict too.
                            if (localVal.text !== serverVal.text) {
                                localVal.conflict = serverVal;
                                hasChanges = true;
                            } else {
                                // Same text landed on the server — just rebase quietly.
                                localVal.rev = serverVal.rev;
                            }
                        } else if (localVal.text !== serverVal.text || localVal.rev !== serverVal.rev) {
                            // Not locally modified — take the server's version + revision.
                            this.currentTask.translations[blockId] = serverVal;
                            hasChanges = true;
                        }
                    }

                    this.lastMtime = serverMtime;
                    if (hasChanges) {
                        renderBlockEditors();
                        renderPage();
                        showToast(t('collabSyncSuccess'), 'success');
                    }
                } catch (e) {
                    console.error("Auto-sync translations failed:", e);
                }
            },

            // Reload pages.json after another user changed the structure (region edits /
            // page delete). Translations (separate state) are preserved; the current page
            // index is clamped in case pages were removed.
            async reloadStructure() {
                if (!this.isServer) return;
                try {
                    const resp = await fetch(`api/data?t=${this.token}`);
                    if (!resp.ok) return;
                    const data = await resp.json();
                    this.currentTask.data = data;
                    const n = (data.pages || []).length;
                    if (state.currentPageIndex >= n) state.currentPageIndex = Math.max(0, n - 1);
                    renderPageList();
                    selectPage(state.currentPageIndex);
                    refreshAllPageProgress();
                } catch (e) {
                    console.error("Structure reload failed:", e);
                }
            },

            // Throttled live cursor / typing relay (collab2). Lets collaborators see the
            // block you're in and a preview of what you're typing, in real time.
            sendCursor(blockId, text) {
                if (!this.isServer || !this.collab2 || !this.token) return;
                this._cursorPending = { block: blockId, text: text != null ? String(text).slice(0, 200) : '' };
                if (this._cursorTimer) return;   // trailing-edge throttle (~350ms)
                this._cursorTimer = setTimeout(() => {
                    this._cursorTimer = null;
                    const p = this._cursorPending; this._cursorPending = null;
                    if (!p) return;
                    fetch(`api/collab/cursor?t=${this.token}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            page: state.currentPageIndex, block: p.block,
                            lang: elements.targetLangSelect.value, text: p.text
                        })
                    }).catch(() => {});
                }, 350);
            },

            clearCursor() {
                if (!this.isServer || !this.collab2 || !this.token) return;
                fetch(`api/collab/cursor?t=${this.token}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page: state.currentPageIndex, block: null, lang: elements.targetLangSelect.value, text: '' })
                }).catch(() => {});
            }
        };

        const ctx = elements.canvas.getContext('2d');

        // Inline SVG icons (feather style, matching the header) so the UI uses one

        const ICONS = {
            trash: '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>',

            moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>',
            copy: '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>',
            eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>',
            eyeOff: '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        };
        // Build an <svg> element from trusted static markup. The markup constants in
        // ICONS are not user data, so innerHTML here is safe.
        function svgIcon(markup, size = 16) {
            const tmp = document.createElement('span');
            tmp.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle">${markup}</svg>`;
            return tmp.firstChild;
        }

        // Page-top loading bar. start()/done() are reentrant (depth-counted) so nested
        // or overlapping loads (e.g. selectServerTask → loadServerTask) show one smooth
        // bar. It trickles toward 90% while work runs, then snaps to 100% and fades.
        const topProgress = {
            el: null, bar: null, timer: null, value: 0, depth: 0,
            _init() {
                if (!this.el) {
                    this.el = document.getElementById('top-progress');
                    this.bar = document.getElementById('top-progress-bar');
                }
            },
            _render() { if (this.bar) this.bar.style.transform = `scaleX(${this.value})`; },
            start() {
                this._init(); if (!this.el) return;
                if (++this.depth > 1) return;            // a load is already in progress
                this.value = 0.08; this.el.classList.add('active'); this._render();
                clearInterval(this.timer);
                this.timer = setInterval(() => {
                    const remaining = 0.9 - this.value;  // ease toward 90%, never reaching it
                    if (remaining > 0.001) { this.value += remaining * 0.12; this._render(); }
                }, 200);
            },
            done() {
                this._init(); if (!this.el) return;
                this.depth = Math.max(0, this.depth - 1);
                if (this.depth > 0) return;              // other loads still running
                clearInterval(this.timer); this.timer = null;
                this.value = 1; this._render();
                setTimeout(() => {
                    if (this.depth === 0) {
                        this.el.classList.remove('active');
                        setTimeout(() => { if (this.depth === 0) { this.value = 0; this._render(); } }, 300);
                    }
                }, 250);
            }
        };

        // Tool/app name. Defaults to "Manga Translator"; a server can override it by
        // setting window.MTL_APP_NAME (see the script in <head>). Drives the tab title
        // and the header brand so deployments can rename the tool.
        const APP_NAME = (window.MTL_APP_NAME || 'Manga Translator');
        (function applyAppName() {
            document.title = APP_NAME;
            const brand = document.getElementById('app-brand');
            if (brand) brand.textContent = APP_NAME;
        })();

        // Single source of truth for the unsaved-changes state: keeps state.isDirty, the
        // Save button's enabled/indicator state, and the title marker in sync.
        function setDirty(d) {
            state.isDirty = d;
            elements.btnSave.disabled = !d;
            elements.btnSave.classList.toggle('unsaved', d);
            document.title = (d ? '• ' : '') + APP_NAME;
        }

        // Light/dark theme: sets the data-theme attribute (CSS variables do the rest),
        // persists the choice, and shows the icon of the mode you'd switch to.
        function applyTheme(theme) {
            const t2 = theme === 'light' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t2);
            localStorage.setItem('editor-theme', t2);
            const btn = document.getElementById('btn-theme');
            if (btn) { btn.innerHTML = ''; btn.appendChild(svgIcon(t2 === 'light' ? ICONS.moon : ICONS.sun, 18)); }
        }

        // Privacy guard: blur the central image area and right-hand editor whenever
        // the window loses focus (tab switch, click away, minimize), so on-screen
        // manga content isn't exposed to onlookers. Enabled by default; the header
        // eye button toggles it and the choice is persisted.
        const privacy = {
            enabled: localStorage.getItem('editor-privacy') !== 'off',
            setBlur(on) {
                document.body.classList.toggle('privacy-blurred', !!(on && this.enabled));
            },
            refresh() {
                // Re-evaluate against the live focus/visibility state.
                this.setBlur(document.hidden || !document.hasFocus());
            },
            updateButton() {
                const btn = document.getElementById('btn-privacy');
                if (!btn) return;
                btn.innerHTML = '';
                btn.appendChild(svgIcon(this.enabled ? ICONS.eyeOff : ICONS.eye, 18));
                btn.classList.toggle('active', this.enabled);
                const tip = t(this.enabled ? 'privacyOn' : 'privacyOff');
                btn.title = tip; btn.setAttribute('aria-label', tip);
                const hintText = document.getElementById('privacy-hint-text');
                if (hintText) hintText.textContent = t('privacyHint');
            },
            toggle() {
                this.enabled = !this.enabled;
                localStorage.setItem('editor-privacy', this.enabled ? 'on' : 'off');
                this.updateButton();
                this.refresh();
            },
            init() {
                this.updateButton();
                document.getElementById('btn-privacy').onclick = () => this.toggle();
                window.addEventListener('blur', () => this.refresh());
                window.addEventListener('focus', () => this.setBlur(false));
                document.addEventListener('visibilitychange', () => this.refresh());
                this.refresh();
            }
        };

            // Merge Logic

            // Resizer Logic
            const resizer = document.getElementById('editor-resizer');

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;

        let isMergeMode = false;
        let selectedTasksForMerge = []; // Array of {name, handle} to preserve order

        function toggleMergeMode(active) {
            isMergeMode = active;
            selectedTasksForMerge = [];
            document.getElementById('merge-controls').style.display = active ? 'flex' : 'none';
            document.getElementById('btn-merge').style.display = active ? 'none' : 'block';

        async function performMerge() {
            if (selectedTasksForMerge.length < 2) {
                showToast(t('msgSelectTasks'), 'error');
                return;
            }

            elements.statusLoader.style.display = 'block';
            elements.statusText.textContent = t('msgMerging');
            elements.statusText.style.display = 'block';

            try {
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                const newTaskName = `merged_${timestamp}`;
                const newFolder = await storage.workDirHandle.getDirectoryHandle(newTaskName, { create: true });
                const newCleanDir = await newFolder.getDirectoryHandle('clean', { create: true });
                const newTransDir = await newFolder.getDirectoryHandle('translations', { create: true });

                const mergedPages = [];
                const mergedTranslations = {}; // lang -> { id: {text, edited} }

                for (const task of selectedTasksForMerge) {
                    const taskHandle = task.handle;
                    const pagesJsonHandle = await taskHandle.getFileHandle('pages.json');
                    const pagesFile = await pagesJsonHandle.getFile();
                    const taskData = JSON.parse(await pagesFile.text());

                    const cleanDir = await taskHandle.getDirectoryHandle('clean');
                    const transDir = await taskHandle.getDirectoryHandle('translations').catch(() => null);

                    // Block ids are formatted as p{page}_b{block}, but the page index
                    // restarts at 0 in every task, so ids collide across tasks. Since
                    // translations are keyed by block id, the colliding keys would
                    // overwrite each other on merge -> scrambled translations. Re-key
                    // every block to a globally-unique id and remap the translation keys.
                    const idMap = {};

                    // Merge pages
                    for (const page of taskData.pages) {
                        const oldImgName = page.clean.split('/').pop();
                        const newPageIdx = mergedPages.length; // 0-based global position

                        // Unified sequential naming: every merged page is renamed
                        // 0001.ext, 0002.ext, ... in reading order. This keeps a single
                        // continuous ordering after render instead of per-chapter names
                        // (001, 002 ...) that collide and interleave when sorted.
                        const dot = oldImgName.lastIndexOf('.');
                        const ext = dot >= 0 ? oldImgName.slice(dot) : '.png';
                        const newImgName = `${String(newPageIdx + 1).padStart(4, '0')}${ext}`;

                        // Copy image
                        try {
                            const oldImgHandle = await cleanDir.getFileHandle(oldImgName);
                            const newImgHandle = await newCleanDir.getFileHandle(newImgName, { create: true });
                            const writable = await newImgHandle.createWritable();
                            await writable.write(await oldImgHandle.getFile());
                            await writable.close();
                        } catch (e) {
                            console.warn(`Failed to copy image ${oldImgName} from task ${taskHandle.name}`, e);
                        }

                        // Add to merged pages with the unified name / index.
                        const newPage = JSON.parse(JSON.stringify(page));
                        newPage.clean = `clean/${newImgName}`;
                        newPage.name = newImgName;
                        newPage.index = newPageIdx;

                        // Re-key this page's block ids using its final (unique) position
                        // in the merged task, recording old->new so translations follow.
                        if (Array.isArray(newPage.blocks)) {
                            newPage.blocks.forEach((block, bIdx) => {
                                const oldId = block.id;
                                const newId = `p${String(newPageIdx).padStart(4, '0')}_b${String(bIdx).padStart(3, '0')}`;
                                if (oldId != null) idMap[oldId] = newId;
                                block.id = newId;
                            });
                        }
                        mergedPages.push(newPage);
                    }

                    // Merge translations
                    if (transDir) {
                        for await (const entry of transDir.values()) {
                            if (entry.kind === 'file' && entry.name.endsWith('.json')) {
                                const lang = entry.name.replace('.json', '');
                                if (!mergedTranslations[lang]) mergedTranslations[lang] = {};

                                const transFile = await entry.getFile();
                                const transData = JSON.parse(await transFile.text());
                                // Remap each translation onto the re-keyed block id so it
                                // stays attached to the right page/block after merging.
                                for (const [oldId, val] of Object.entries(transData)) {
                                    const newId = idMap[oldId] || oldId;
                                    mergedTranslations[lang][newId] = val;
                                }
                            }
                        }
                    }
                }

                // Write new pages.json
                const newPagesJsonHandle = await newFolder.getFileHandle('pages.json', { create: true });
                const writablePages = await newPagesJsonHandle.createWritable();
                await writablePages.write(JSON.stringify({ pages: mergedPages, target_lang: elements.targetLangSelect.value }, null, 2));
                await writablePages.close();

                // Write new translations
                for (const [lang, data] of Object.entries(mergedTranslations)) {
                    const newTransHandle = await newTransDir.getFileHandle(`${lang}.json`, { create: true });
                    const writableTrans = await newTransHandle.createWritable();
                    await writableTrans.write(JSON.stringify(data, null, 2));
                    await writableTrans.close();
                }

                showToast(t('mergeSuccess', { name: newTaskName }), 'success');
                toggleMergeMode(false);
                await renderTaskList();
            } catch (e) {
                console.error(e);
                showToast("Merge failed: " + e.message, "error");
            } finally {
                elements.statusLoader.style.display = 'none';
                elements.statusText.style.display = 'none';
            }
        }

        // Pipeline is usable only in server mode AND when the server reports
        // manga_translator_lite is installed. Reason picks the right explanation.

        // Grow the story textarea to fit its content (with a sensible minimum) so
        // long descriptions don't sit in a tiny scrollbox.
        function autoGrowStory() {

        async function loadStoryFile() {
            if (!storage.currentTask) {
                document.getElementById('story-content').value = '';
                document.getElementById('story-content').disabled = true;
                document.getElementById('btn-save-story').disabled = true;
                document.getElementById('story-template-select').disabled = true;
                return;
            }
            
            document.getElementById('story-content').disabled = false;
            document.getElementById('btn-save-story').disabled = false;
            document.getElementById('story-template-select').disabled = false;

            if (storage.isServer) {
                try {
                    const resp = await fetch(`api/story?t=${storage.token}`);
                    if (resp.ok) {
                        const text = await resp.text();
                        document.getElementById('story-content').value = text || '';
                    } else {
                        document.getElementById('story-content').value = '';
                    }
                } catch (e) {
                    document.getElementById('story-content').value = '';
                }
            } else {
                try {
                    const fileHandle = await storage.currentTask.handle.getFileHandle('story.txt');
                    const file = await fileHandle.getFile();
                    const text = await file.text();
                    document.getElementById('story-content').value = text || '';
                } catch (e) {
                    document.getElementById('story-content').value = '';
                }

        async function saveStoryFile() {
            if (!storage.currentTask) return;
            const content = document.getElementById('story-content').value;
            if (storage.isServer) {
                try {
                    const resp = await fetch(`api/story/save?t=${storage.token}`, {
                        method: 'POST',
                        body: content
                    });
                    if (resp.ok) {
                        showToast("story.txt saved on server!", "success");
                    } else {
                        throw new Error("Server responded with error");
                    }
                } catch (e) {
                    // Fallback to download
                    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'story.txt';
                    a.click();
                    showToast("Downloaded story.txt instead: " + e.message, "success");
                }
            } else {
                try {
                    const fileHandle = await storage.currentTask.handle.getFileHandle('story.txt', { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    showToast("story.txt saved!", "success");
                } catch (e) {
                    showToast("Failed to save story.txt: " + e.message, "error");

        async function runPipeline() {
            if (!pipelineEnabled()) {
                showToast(t(pipelineDisabledReason()), "error");
                return;
            }

            const btn = document.getElementById('btn-run-pipeline');
            const cmd = document.getElementById('pipeline-cmd').value;
            // Cross-language reference: 'auto' | 'off' | [codes...]. Only meaningful for
            // translate/run; harmless on other commands (server ignores it).
            const refMode = document.getElementById('pipeline-ref-mode').value;
            let reference_langs = refMode;   // 'auto' or 'off'
            if (refMode === 'custom') {
                reference_langs = document.getElementById('pipeline-ref-langs').value
                    .split(',').map(s => s.trim()).filter(Boolean);
            }

            const payload = {
                cmd: cmd,
                target_lang: elements.targetLangSelect.value,
                overwrite: document.getElementById('pipeline-overwrite').checked,
                input: document.getElementById('pipeline-input').value,
                output: document.getElementById('pipeline-output').value,
                config: document.getElementById('pipeline-config').value,
                start_index: parseInt(document.getElementById('pipeline-start-index').value),
                reference_langs: reference_langs
            };

            btn.disabled = true;
            toggleTerminal(true);
            const output = document.getElementById('terminal-output');
            output.innerHTML = `<div class="status">Starting ${cmd}...</div>`;

            try {
                const response = await fetch(`api/pipeline/run?t=${storage.token}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                const div = document.createElement('div');
                                if (data.type === 'error') div.className = 'error';
                                else if (data.type === 'status') div.className = 'status';
                                div.textContent = data.msg;
                                output.appendChild(div);
                                output.scrollTop = output.scrollHeight;

                                if (data.msg.includes('--- Pipeline Finished ---')) {
                                    showToast("Pipeline completed!", "success");
                                    // Optionally reload data
                                    if (cmd !== 'render') storage.loadServerTask();
                                }
                            } catch (e) { console.error("Parse error", e, line); }
                        }
                    }
                }
            } catch (e) {
                const div = document.createElement('div');
                div.className = 'error';
                div.textContent = `Request failed: ${e.message}`;
                output.appendChild(div);
            } finally {
                btn.disabled = false;
            }
        }

        async function renderTaskList() {
            if (storage.isServer) return;   // server mode uses renderServerTaskList()
            elements.taskList.innerHTML = '';

            function addTaskItem(name, handle, pagesJsonHandle) {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.dataset.taskName = name;

                if (isMergeMode) {
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.style.marginRight = '8px';
                    checkbox.checked = selectedTasksForMerge.some(t => t.name === name);
                    checkbox.onclick = (e) => e.stopPropagation();
                    checkbox.onchange = () => {
                        if (checkbox.checked) {
                            if (!selectedTasksForMerge.some(t => t.name === name)) {
                                selectedTasksForMerge.push({ name: name, handle: handle });
                            }
                        } else {
                            selectedTasksForMerge = selectedTasksForMerge.filter(t => t.name !== name);
                        }
                        // The push order is the merge order; refresh badges so the
                        // numbering reflects it (and renumbers after a deselect).
                        refreshMergeOrderBadges();
                    };
                    item.appendChild(checkbox);

                    // Badge showing this task's position in the merge order.
                    const badge = document.createElement('span');
                    badge.className = 'merge-order-badge';
                    badge.title = t('mergeOrderTip');
                    badge.style.cssText = 'display:none;align-items:center;justify-content:center;min-width:18px;height:18px;margin-right:6px;padding:0 5px;border-radius:9px;background:var(--accent, #4a90d9);color:#fff;font-size:0.7rem;font-weight:bold;';
                    item.appendChild(badge);
                }

                const label = document.createElement('span');
                label.className = 'task-name';
                // Truncate in the middle (keep head + tail) so both ends stay
                // visible — important for picking tasks by name in merge mode.
                label.textContent = middleTruncate(name);
                label.title = name; // full name on hover
                item.appendChild(label);

                item.onclick = async () => {
                    if (isMergeMode) {
                        const cb = item.querySelector('input');
                        cb.checked = !cb.checked;
                        cb.onchange();
                    } else {
                        await selectTask({ name: name, handle: handle, pagesJsonHandle: pagesJsonHandle }, item);
                    }
                };

                elements.taskList.appendChild(item);
            }

            let directTasks = [];
            for await (const entry of storage.workDirHandle.values()) {
                if (entry.kind === 'directory' && entry.name !== 'work') {
                    try {
                        const pagesJsonHandle = await entry.getFileHandle('pages.json');
                        directTasks.push({ name: entry.name, handle: entry, pagesJsonHandle: pagesJsonHandle });
                    } catch (e) {}
                }
            }

            let workDirHandle = null;
            try {
                workDirHandle = await storage.workDirHandle.getDirectoryHandle('work');
            } catch (e) {}

            let workTasks = [];
            if (workDirHandle) {
                for await (const entry of workDirHandle.values()) {
                    if (entry.kind === 'directory') {
                        try {
                            const pagesJsonHandle = await entry.getFileHandle('pages.json');
                            workTasks.push({ name: entry.name, handle: entry, pagesJsonHandle: pagesJsonHandle });
                        } catch (e) {}
                    }
                }
            }

            const tasksToShow = workTasks.length > 0 ? workTasks : directTasks;
            tasksToShow.forEach(t => addTaskItem(t.name, t.handle, t.pagesJsonHandle));
            refreshMergeOrderBadges();
        }

        // Measure rendered text width so truncation works for full-width CJK too.
        let _measureCtx = null;
        function measureTextWidth(text, font) {
            if (!_measureCtx) _measureCtx = document.createElement('canvas').getContext('2d');
            _measureCtx.font = font;
            return _measureCtx.measureText(text).width;
        }

        // Shorten a long name by keeping its head and tail and eliding the middle,
        // fitting the actual available pixel width (accounts for CJK width and the
        // checkbox/order-badge that appear in merge mode). e.g.
        // "「田中くんが〜」番外編最終話_v2" -> "「田中くん…最終話_v2".
        function middleTruncate(name) {
            if (!name) return name;
            const listW = (elements.taskList && elements.taskList.clientWidth) || 240;
            // list-item padding (24) + safety margin + checkbox & badge in merge mode.
            const reserved = 24 + 16 + (isMergeMode ? 54 : 0);
            const avail = Math.max(48, listW - reserved);
            const fam = getComputedStyle(document.body).fontFamily || 'sans-serif';
            const font = `13.6px ${fam}`; // matches .list-item font-size (0.85rem)
            if (measureTextWidth(name, font) <= avail) return name;
            const ell = '…';
            for (let keep = name.length - 1; keep >= 2; keep--) {
                const head = Math.ceil(keep * 0.6);
                const tail = keep - head;
                const cand = name.slice(0, head) + ell + name.slice(name.length - tail);
                if (measureTextWidth(cand, font) <= avail) return cand;
            }
            return name.charAt(0) + ell;
        }

        // Update the order badges in-place to reflect the current merge (click) order,
        // without re-reading the directory.
        function refreshMergeOrderBadges() {
            elements.taskList.querySelectorAll('.list-item').forEach(item => {
                const badge = item.querySelector('.merge-order-badge');
                if (!badge) return;
                const order = selectedTasksForMerge.findIndex(t => t.name === item.dataset.taskName);
                if (order >= 0) {
                    badge.textContent = order + 1;
                    badge.style.display = 'inline-flex';
                } else {
                    badge.style.display = 'none';
                }
            });
        }

        async function selectTask(task, itemEl) {
            if (state.isDirty && !confirm(t('confirmSwitch'))) return;
            elements.statusLoader.style.display = 'block';
            try {
                // Clear previous task state before loading new one
                storage.currentTask = null;

                await storage.loadLocalTask(task);

                // Highlight selected task
                Array.from(elements.taskList.children).forEach(el => el.classList.remove('active'));
                if (itemEl) itemEl.classList.add('active');

                renderPageList();
                selectPage(0);
                elements.btnReload.disabled = false;
                if (document.getElementById('tab-story').classList.contains('active')) {
                    loadStoryFile();
                }
                if (state.activeFocusArea !== 'tasks') {
                    state.activeFocusArea = 'pages';
                }
            } catch (e) {
                console.error(e);
                showToast("Load failed: " + e.message, "error");
            }

        }

        // ---- Per-page translation progress ----
        // Fill a badge with "done/total" and color it (green = complete, amber =
        // partial); hide it entirely for no-text pages.
        function setPageProgress(badge, page) {
            const blocks = page.blocks || [];
            const total = blocks.length;
            if (total === 0) { badge.style.display = 'none'; return; }
            const tr = storage.currentTask.translations || {};
            let done = 0;
            blocks.forEach(b => { const tx = tr[b.id]?.text; if (tx && tx.trim()) done++; });
            badge.style.display = '';
            badge.textContent = `${done}/${total}`;
            badge.className = 'page-prog ' + (done >= total ? 'done' : 'partial');
        }
        // Update just the current page's badge (cheap, used while typing).
        function updateCurrentPageProgress() {
            const item = elements.pageList.children[state.currentPageIndex];
            const page = storage.currentTask?.data.pages[state.currentPageIndex];
            if (!item || !page) return;
            const badge = item.querySelector('.page-prog');
            if (badge) setPageProgress(badge, page);
        }
        // Refresh every page badge in place (used after a language switch / import,
        // which change many blocks at once but keep the current selection).
        function refreshAllPageProgress() {
            if (!storage.currentTask) return;
            const pages = storage.currentTask.data.pages;
            Array.from(elements.pageList.children).forEach((item, i) => {
                const badge = item.querySelector('.page-prog');
                if (badge && pages[i]) setPageProgress(badge, pages[i]);
            });
        }

        // ---- Lazy page thumbnails (works in both local and server modes) ----
        // storage.getThumbUrl() abstracts the two backends: server mode returns an
        // api/thumb URL (scaled + cached), local mode a blob: URL from the file handle.
        let pageThumbObserver = null;
        function loadPageThumb(imgEl, page) {
            if (!imgEl || imgEl.dataset.loaded || !page) return;
            imgEl.dataset.loaded = '1';
            storage.getThumbUrl(page).then(url => {
                if (!url) return;
                // Once the <img> has decoded a blob: URL we can revoke it immediately
                // (the picture stays) so local mode doesn't leak object URLs per page.
                imgEl.onload = () => { if (!storage.isServer) URL.revokeObjectURL(url); };
                imgEl.onerror = () => { if (!storage.isServer) URL.revokeObjectURL(url); };
                imgEl.src = url;
            }).catch(() => {});
        }

        function renderPageList() {
            if (elements.boxScale && storage.currentTask) {
                const d = storage.currentTask.data;
                elements.boxScale.value = d.box_scale || 1;
                // Per-task overrides: blank = inherit config (shown as placeholder).
                elements.taskMinFont.value = (d.font_size_minimum != null) ? d.font_size_minimum : '';
                elements.taskExpand.value = (d.font_size_minimum_expand_limit != null) ? d.font_size_minimum_expand_limit : '';
                if (globalConfig && globalConfig.render) {
                    if (globalConfig.render.font_size_minimum != null) elements.taskMinFont.placeholder = globalConfig.render.font_size_minimum;
                    if (globalConfig.render.font_size_minimum_expand_limit != null) elements.taskExpand.placeholder = globalConfig.render.font_size_minimum_expand_limit;
                }
            }
            elements.pageList.innerHTML = '';

            // (Re)build the lazy-load observer so only thumbnails scrolled into view
            // fetch their image — a 200-page task won't pull 200 full images at once.
            if (pageThumbObserver) pageThumbObserver.disconnect();
            pageThumbObserver = new IntersectionObserver((entries) => {
                entries.forEach(en => {
                    if (!en.isIntersecting) return;
                    const el = en.target;
                    loadPageThumb(el, storage.currentTask.data.pages[+el.dataset.pageIdx]);
                    pageThumbObserver.unobserve(el);
                });
            }, { root: elements.pageList, rootMargin: '300px 0px' });

            storage.currentTask.data.pages.forEach((page, index) => {
                const item = document.createElement('div');
                item.className = 'list-item page-item';

                const thumb = document.createElement('img');
                thumb.className = 'page-thumb';

                thumb.dataset.pageIdx = index;
                item.appendChild(thumb);

                const label = document.createElement('span');

                const del = document.createElement('button');
                del.className = 'page-del-btn';
                del.appendChild(svgIcon(ICONS.trash, 14));
                del.title = t('btnDeletePage');
                del.setAttribute('aria-label', t('btnDeletePage'));
                del.onclick = (e) => { e.stopPropagation(); deletePage(index); };
                item.appendChild(del);

                item.onclick = () => selectPage(index);
                elements.pageList.appendChild(item);
                pageThumbObserver.observe(thumb);

        // ===== Import an external translation file and merge only the differences =====
        function _entryText(v) {
            if (v == null) return '';
            if (typeof v === 'string') return v;
            if (typeof v === 'object') return v.text || '';
            return String(v);
        }
        function _buildBlockIndex() {
            const map = {};
            (storage.currentTask.data.pages || []).forEach((p, pi) => {
                (p.blocks || []).forEach(b => { map[b.id] = { orig: b.text || '', page: pi + 1 }; });
            });
            return map;
        }

        // Export the current target language's translations as a downloadable
        // {LANG}.json — the counterpart to import. Server-mode only (in local mode the
        // file is already on disk); exports the in-memory set, i.e. current edits too.
        document.getElementById('btn-export-trans').onclick = () => {
            if (!storage.currentTask) { showToast(t('emptySelectPage'), 'error'); return; }
            const lang = elements.targetLangSelect.value;

            const blob = new Blob([json], { type: 'application/json' });

        elements.btnImportTrans.onclick = () => {
            if (!storage.currentTask) { showToast(t('emptySelectPage'), 'error'); return; }
            elements.importTransFile.value = '';

        };
        elements.importTransFile.onchange = async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            // Warn if the file looks like a different language than the one being edited.
            const fileLang = file.name.replace(/\.json$/i, '').toUpperCase();
            const curLang = (elements.targetLangSelect.value || '').toUpperCase();
            const knownLangs = Array.from(elements.targetLangSelect.options).map(o => o.value.toUpperCase());
            if (knownLangs.includes(fileLang) && fileLang !== curLang) {
                if (!confirm(t('importLangMismatch', { file: fileLang, cur: curLang }))) return;
            }
            let data;
            try { data = JSON.parse(await file.text()); }
            catch (err) { showToast(t('importBadFile'), 'error'); return; }
            if (!data || typeof data !== 'object' || Array.isArray(data) || data.pages) {
                showToast(t('importBadFile'), 'error'); return;
            }
            const cur = storage.currentTask.translations || {};
            const diffs = [];
            for (const [id, val] of Object.entries(data)) {
                const imp = _entryText(val);
                const curT = _entryText(cur[id]);
                if (imp === curT) continue;   // identical → ignore
                diffs.push({ id, cur: curT, imp });
            }
            if (!diffs.length) { showToast(t('importNoDiff')); return; }
            showImportDiffModal(diffs);
        };

        function showImportDiffModal(diffs) {
            const blockIdx = _buildBlockIndex();
            const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
            const panel = document.createElement('div'); panel.className = 'modal-panel';
            panel.style.width = '760px';

            const title = document.createElement('h3');
            title.textContent = `${t('importTitle')} — ${diffs.length}`;
            panel.appendChild(title);

            const tb = document.createElement('div'); tb.className = 'diff-toolbar';
            const selAll = document.createElement('input'); selAll.type = 'checkbox'; selAll.checked = true; selAll.id = 'diff-sel-all';
            const selAllLabel = document.createElement('label'); selAllLabel.htmlFor = 'diff-sel-all'; selAllLabel.textContent = t('importSelectAll');
            const counter = document.createElement('span'); counter.className = 'diff-count';
            tb.appendChild(selAll); tb.appendChild(selAllLabel); tb.appendChild(counter);

            diffs.forEach(d => {
                const item = document.createElement('div'); item.className = 'diff-item';

                const head = document.createElement('div'); head.className = 'diff-head';
                let headTxt = d.id + (info ? ` · P${info.page}` : ` · ${t('importOrphan')}`);

                head.textContent = headTxt;

                const cols = document.createElement('div'); cols.className = 'diff-cols';

                const curVal = document.createElement('div'); curVal.className = 'diff-val diff-cur'; curVal.textContent = d.cur || '∅';
                curCol.appendChild(curLabel); curCol.appendChild(curVal);

                const impCol = document.createElement('div'); impCol.className = 'diff-col diff-col-imp';
                const impLabel = document.createElement('div'); impLabel.className = 'diff-col-label'; impLabel.textContent = t('importNew');
                const impVal = document.createElement('div'); impVal.className = 'diff-val diff-imp'; impVal.textContent = d.imp || '∅';
                impCol.appendChild(impLabel); impCol.appendChild(impVal);

                cols.appendChild(curCol); cols.appendChild(impCol);
                body.appendChild(head); body.appendChild(cols);
                item.appendChild(cb); item.appendChild(body);
                list.appendChild(item);
                cb.onchange = updateCounter;
            });
            panel.appendChild(list);

            function updateCounter() {
                const n = checks.filter(c => c.checked).length;
                counter.textContent = `(${n}/${diffs.length})`;
                selAll.checked = n === diffs.length;
            }
            selAll.onchange = () => { checks.forEach(c => c.checked = selAll.checked); updateCounter(); };
            updateCounter();

            const actions = document.createElement('div'); actions.className = 'modal-actions';
            const cancel = document.createElement('button'); cancel.className = 'secondary'; cancel.textContent = t('importCancel');
            const apply = document.createElement('button'); apply.textContent = t('importApply');
            actions.appendChild(cancel); actions.appendChild(apply);

            function close() { overlay.remove(); document.removeEventListener('keydown', onKey); }
            function onKey(ev) { if (ev.key === 'Escape') close(); }
            cancel.onclick = close;
            overlay.onclick = (ev) => { if (ev.target === overlay) close(); };
            document.addEventListener('keydown', onKey);
            apply.onclick = async () => {

                if (!sel.length) { close(); return; }
                sel.forEach(d => {
                    const prev = storage.currentTask.translations[d.id] || {};
                    storage.currentTask.translations[d.id] = { text: d.imp, edited: true, author: prev.author, rev: prev.rev };
